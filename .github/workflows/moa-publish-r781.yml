name: MOA R781 verified original-signed release
on:
  push:
    branches: [moa-update-channel]
    paths: ['.github/workflows/moa-publish-r781.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: moa-update-channel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 46118740358
          name: moa-r781-r782-offline-signing-kit-no-private-key
          github-token: ${{ github.token }}
          path: kit
      - name: Reconstruct exact locally signed bytes and check both payloads
        shell: bash
        run: |
          set -euo pipefail
          (cd kit && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import base64,hashlib,struct,zlib,pathlib,zipfile,io,json
          p=pathlib.Path('android/releases')
          cert='5a86862beacac780a83729f3c01584d6d0ea5be88cf51827cb0b257d9caa0f15'
          sha=lambda b:hashlib.sha256(b).hexdigest()
          assert json.loads(pathlib.Path('android/latest.json').read_text())['versionCode']==779
          blocks={"781":"","782":""}
          records=[]
          for v,base,uh,sh,size,bh,changed in [
           (781,779,'42478c9e9ee6784ac2b6db23aa25cb3ad18c3a6073effc2245046efa685494cd','b6e55392b63def4fe12bb50d554eda9e70c37ba0270b87c649495d405420246e',11032976,'5e10d4428fded0d0c74e188c4dcf9e92e852f6ba7f6af2ebcbc26ff84c867e61',{'AndroidManifest.xml','classes27.dex','assets/web/family-diary.js','assets/web/moa-r697-vertical-calendar.js','assets/web/moa-r755-inline-ai.js'}),
           (782,771,'fd03abeacd367af3a46ebc17ff88a692dec60b36441d10b51ea789390b82c491','5a7479ccf0dde6afe9c5fbd75cf535f2d2dbc0948b0ecb26ac90f6fe153fa689',10996112,'2c045980073c93e08cdc8f09f41f2d749a54d1767f4f59884ec773bf7cc3c92d',{'AndroidManifest.xml'})]:
           a=pathlib.Path(f'kit/MOA_R{v}_UNSIGNED_DO_NOT_INSTALL.apk').read_bytes()
           assert sha(a)==uh
           z=zipfile.ZipFile(io.BytesIO(a));out=bytearray();offsets={}
           for x in sorted(z.infolist(),key=lambda x:x.header_offset):
            h=x.header_offset;n,e=struct.unpack_from('<HH',a,h+26);name=a[h+30:h+30+n];d=h+30+n+e;offsets[h]=len(out);extra=b''
            if x.compress_type==0:
             pad=(-(len(out)+30+n+6))%4;extra=struct.pack('<HHH',0xd935,pad+2,4)+bytes(pad)
            out+=a[h:h+28]+struct.pack('<H',len(extra))+name+extra+a[d:d+x.compress_size]
           out+=bytes((-len(out))%4096)
           block=zlib.decompress(base64.b64decode(blocks[str(v)],validate=True))
           assert len(block)==4096 and block[-16:]==b'APK Sig Block 42'
           out+=block;newcd=len(out);ap=z.start_dir
           for x in z.infolist():
            n,e,c=struct.unpack_from('<HHH',a,ap+28);length=46+n+e+c;h=struct.unpack_from('<I',a,ap+42)[0];out+=a[ap:ap+42]+struct.pack('<I',offsets[h])+a[ap+46:ap+length];ap+=length
           assert a[ap:ap+4]==b'PK\x05\x06'
           out+=a[ap:ap+16]+struct.pack('<I',newcd)+a[ap+20:]
           assert len(out)==size and sha(out)==sh,(v,len(out),sha(out))
           old=(p/f'moa-r{base}.apk').read_bytes();assert sha(old)==bh
           with zipfile.ZipFile(io.BytesIO(out)) as new,zipfile.ZipFile(io.BytesIO(old)) as prior:
            assert new.testzip() is None and set(new.namelist())==set(prior.namelist())==set(z.namelist())
            assert all(new.read(n)==z.read(n) for n in z.namelist())
            actual={n for n in new.namelist() if new.read(n)!=prior.read(n)}
            assert actual==changed,(v,actual)
            ds=[n for n in new.namelist() if n.endswith('.dex')];assert len(ds)==27
            for n in ds:
             b=new.read(n);assert b[:4]==b'dex\n' and hashlib.sha1(b[32:]).digest()==b[12:32] and zlib.adler32(b[12:])&0xffffffff==struct.unpack_from('<I',b,8)[0]
            url=b'https://raw.githubusercontent.com/yooogillycloud123/family-journey-personal/moa-update-channel/android/latest.json'
            assert url in new.read('classes24.dex') and new.read('classes24.dex')==prior.read('classes24.dex')
            records.append(dict(version=v,base=base,sha256=sh,bytes=size,changed=sorted(actual),entries=len(new.namelist()),dex=len(ds)))
           f=p/'moa-r781.apk' if v==781 else pathlib.Path('/tmp/moa-r782.apk')
           f.write_bytes(out)
           print('EXACT_LOCALLY_SIGNED_BYTES_AND_PAYLOAD_PASS',v,sh)
          pathlib.Path('/tmp/moa-r781-diff.json').write_text(json.dumps(records,indent=2))
          PY
          test "$(git hash-object android/releases/moa-r781.apk)" = e433719d806020328918a3d7d5f70db8b73af2d3
          test "$(git hash-object /tmp/moa-r782.apk)" = 046658f7050cca0c12345fc815199a733185b4ce
          BT="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1 | xargs dirname)"
          for v in 781 782; do
            f=android/releases/moa-r781.apk
            if [ "$v" = 782 ]; then f=/tmp/moa-r782.apk; fi
            "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 29 "$f" | tee /tmp/cert-$v.txt
            grep -F 'certificate SHA-256 digest: 5a86862beacac780a83729f3c01584d6d0ea5be88cf51827cb0b257d9caa0f15' /tmp/cert-$v.txt
            grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/cert-$v.txt
            "$BT/aapt2" dump badging "$f" | tee /tmp/badging-$v.txt
            grep -F "package: name='com.juhyeon.familyjournea' versionCode='$v' versionName='MOA-R$v'" /tmp/badging-$v.txt
            "$BT/zipalign" -c 4 "$f"
          done
          mkdir -p /tmp/moa-release-evidence
          cp android/releases/moa-r781.apk /tmp/moa-release-evidence/MOA_R781_ORIGINAL_SIGNED.apk
          cp /tmp/moa-r782.apk /tmp/moa-release-evidence/MOA_R782_ORIGINAL_SIGNED.apk
          cp /tmp/moa-r781-diff.json /tmp/cert-*.txt /tmp/badging-*.txt /tmp/moa-release-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: moa-r781-r782-original-signed-verified
          path: /tmp/moa-release-evidence/
      - name: Atomically activate R781 only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin moa-update-channel
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/moa-update-channel)"
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('android/latest.json')
          assert json.loads(p.read_text())['versionCode']==779
          p.write_text(json.dumps(json.loads("{\"packageName\":\"com.juhyeon.familyjournea\",\"signerSha256\":\"5a86862beacac780a83729f3c01584d6d0ea5be88cf51827cb0b257d9caa0f15\",\"versionCode\":781,\"bytes\":11032976,\"sha256\":\"b6e55392b63def4fe12bb50d554eda9e70c37ba0270b87c649495d405420246e\",\"apkUrl\":\"https://raw.githubusercontent.com/yooogillycloud123/family-journey-personal/moa-update-channel/android/releases/moa-r781.apk\",\"published\":true,\"notes\":\"R781 베타: 영어 우선·사진/영상 중심 학습, 자동 생성 안정화 및 Sol 우선. 실기기 검증 대기.\"}"),ensure_ascii=False,indent=2)+'\n')
          PY
          mkdir -p android/verification
          cp /tmp/moa-r781-diff.json android/verification/r781-payload-diff.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/latest.json android/releases/moa-r781.apk android/verification/r781-payload-diff.json
          git commit -m 'Publish exact locally original-signed MOA R781 beta'
          git push origin HEAD:moa-update-channel
      - name: Verify unauthenticated exact nonce immutable endpoints and downloaded APK
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.request,time,hashlib,subprocess,pathlib,datetime
          root='https://raw.githubusercontent.com/yooogillycloud123/family-journey-personal/'
          base=root+'moa-update-channel/android/latest.json'
          expected=json.loads(pathlib.Path('android/latest.json').read_text())
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          for attempt in range(13):
           out={}
           for label,url in [('exact',base),('nonce',base+'?moa_check='+str(time.time_ns())),('immutable',root+head+'/android/latest.json')]:
            try:
             with urllib.request.urlopen(url,timeout=15) as r:
              j=json.load(r);out[label]={'status':r.status,'versionCode':j.get('versionCode'),'matches':r.status==200 and j==expected,'headers':{k:v for k,v in r.headers.items() if k.lower() in ('age','cache-control','x-cache','date','etag','x-served-by')}}
            except Exception as e:out[label]={'error':str(e)}
           if all(x.get('matches') for x in out.values()):break
           if attempt<12:time.sleep(25)
          assert all(out[k].get('matches') for k in ('exact','nonce','immutable')),out
          with urllib.request.urlopen(expected['apkUrl'],timeout=40) as r:
           b=r.read();out['apk']={'status':r.status,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'headers':{k:v for k,v in r.headers.items() if k.lower() in ('age','cache-control','x-cache','date','etag','x-served-by')}}
          assert out['apk']['status']==200 and out['apk']['bytes']==expected['bytes'] and out['apk']['sha256']==expected['sha256'],out
          pathlib.Path('/tmp/moa-r781-public.apk').write_bytes(b)
          out['commit']=head;out['verifiedAtUTC']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          pathlib.Path('android/verification/r781-public-endpoint.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          BT="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1 | xargs dirname)"
          "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 29 /tmp/moa-r781-public.apk | tee /tmp/public-cert.txt
          grep -F 'certificate SHA-256 digest: 5a86862beacac780a83729f3c01584d6d0ea5be88cf51827cb0b257d9caa0f15' /tmp/public-cert.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/public-cert.txt
          "$BT/aapt2" dump badging /tmp/moa-r781-public.apk > /tmp/public-badging.txt
          grep -F "package: name='com.juhyeon.familyjournea' versionCode='781'" /tmp/public-badging.txt
          git add android/verification/r781-public-endpoint.json
          git commit -m 'Record R781 exact public endpoint and full APK verification'
          git push origin HEAD:moa-update-channel
