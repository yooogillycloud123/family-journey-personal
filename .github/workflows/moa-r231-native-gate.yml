name: MOA R231 isolated Naver settings + read-only WebView Java/DEX gate
on:
  push:
    branches: [feature/moa-r231-popup-settings-naver-webview-probe-20261109]
    paths:
      - 'experiments/moa-r231-native/**'
      - '.github/workflows/moa-r231-native-gate.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source_compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK 35
        run: |
          set -euo pipefail
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"
      - name: Native overlay, settings bridge and actual WebView probe compile
        run: |
          set -euo pipefail
          mkdir -p build/moa-r231/classes build/moa-r231/dex
          javac -encoding UTF-8 -source 17 -target 17 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d build/moa-r231/classes \
            experiments/moa-r231-native/MoaNaverReturnOverlay.java \
            experiments/moa-r231-native/MoaNaverFeaturesBridge.java \
            experiments/moa-r231-native/MoaNaverWebProbeDialog.java
          find build/moa-r231/classes -name '*.class' -print0 |
            xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 \
              --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
              --output build/moa-r231/dex
          test -s build/moa-r231/dex/classes.dex
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct,zlib
          d=Path('build/moa-r231/dex/classes.dex').read_bytes()
          assert d.startswith(b'dex\n') and b'MoaNaverReturnOverlay' in d and b'MoaNaverWebProbeDialog' in d and b'MoaNaverFeaturesBridge' in d
          assert d[12:32]==hashlib.sha1(d[32:]).digest()
          assert struct.unpack_from('<I',d,8)[0]==zlib.adler32(d[12:])&0xffffffff
          Path('build/moa-r231/source-dex-sha256.txt').write_text(hashlib.sha256(d).hexdigest()+'  classes.dex\n')
          print('R231_NATIVE_JAVAC_D8_DEX=PASS')
          PY
      - name: UI syntax, privacy, no original Quick Record changes
        run: |
          set -euo pipefail
          node --check experiments/moa-r231-native/assets/web/moa-r231-naver-ui.js
          grep -q 'moa_naver_return_overlay_v1' experiments/moa-r231-native/MoaNaverReturnOverlay.java
          ! grep -q 'moa_quick_overlay_v1' experiments/moa-r231-native/MoaNaverReturnOverlay.java
          ! grep -q 'getCookie' experiments/moa-r231-native/MoaNaverWebProbeDialog.java
          grep -q '네이버지도 복귀 팝업' experiments/moa-r231-native/assets/web/moa-r231-naver-ui.js
          grep -q '숨김 검증' experiments/moa-r231-native/MoaNaverWebProbeDialog.java
          echo 'R231_UI_READONLY_PRIVACY=PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MOA-R231-ISOLATED-SOURCE-DEX-NO-PRIVATE-APK
          path: build/moa-r231/
          retention-days: 7
