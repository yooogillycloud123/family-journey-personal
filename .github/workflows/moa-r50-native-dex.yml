name: MOA R50 exact HostActivity bridge DEX
on:
  push:
    branches: [main]
    paths:
      - android/app/src/main/java/com/juhyeon/familyjourney/MoaMoment*.java
      - .github/workflows/moa-r50-native-dex.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native_dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android 35 platform and D8
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile exact R50 bridge without rebundling original HostActivity
        shell: bash
        run: |
          set -euo pipefail
          JAVA_LIB="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p /tmp/moar50/stub/com/juhyeon/familyjourney /tmp/moar50/classes /tmp/moar50/dex
          cat > /tmp/moar50/stub/com/juhyeon/familyjourney/HostActivity.java <<'STUB'
          package com.juhyeon.familyjourney;
          public class HostActivity extends android.app.Activity {}
          STUB
          javac -encoding UTF-8 -source 17 -target 17 -cp "$JAVA_LIB" \
            -d /tmp/moar50/classes \
            /tmp/moar50/stub/com/juhyeon/familyjourney/HostActivity.java \
            android/app/src/main/java/com/juhyeon/familyjourney/MoaMoment*.java
          rm /tmp/moar50/classes/com/juhyeon/familyjourney/HostActivity.class
          find /tmp/moar50/classes -name '*.class' | sort > /tmp/moar50/classfiles.txt
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 26 --lib "$JAVA_LIB" \
            --output /tmp/moar50/dex @/tmp/moar50/classfiles.txt
          test -s /tmp/moar50/dex/classes.dex
          python3 - <<'PY'
          import os,struct,hashlib,zlib,json,base64
          from pathlib import Path
          data=Path('/tmp/moar50/dex/classes.dex').read_bytes()
          assert data.startswith(b'dex\n') and hashlib.sha1(data[32:]).digest()==data[12:32]
          assert zlib.adler32(data[12:])&0xffffffff==struct.unpack_from('<I',data,8)[0]
          assert b'MoaMomentBridgeHostActivity' in data
          assert b'MoaMomentCaptureService' in data
          out=Path('build/moa-r50')
          out.mkdir(parents=True,exist_ok=True)
          (out/'native.dex.z.b64').write_text(base64.b64encode(zlib.compress(data,9)).decode()+'\n')
          (out/'manifest.json').write_text(json.dumps({'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'format':'dex','abi':'Android API 26+','exact_host':'com.juhyeon.familyjourney.HostActivity','bridge':'MoaMomentBridgeHostActivity'},indent=2)+'\n')
          print('R50_COMPILE_PASS',len(data),hashlib.sha256(data).hexdigest())
          PY
      - name: Commit reproducible DEX for APK packaging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build/moa-r50/native.dex.z.b64 build/moa-r50/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'CI verified R50 exact HostActivity native bridge DEX'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: moa-r50-verified-native-dex
          path: |
            build/moa-r50/native.dex.z.b64
            build/moa-r50/manifest.json
