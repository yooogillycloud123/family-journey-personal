name: MOA R783 registered calendar source inspection
on:
  push:
    branches: [feature/moa-r783-registered-only-reconcile-20261128]
    paths: ['.github/workflows/moa-r783-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact released R781 assets
        run: |
          curl -fLsS https://raw.githubusercontent.com/yooogillycloud123/family-journey-personal/ac74bc93046fdc2533e93dea2d9fe9eaefc40661/android/releases/moa-r781.apk -o /tmp/r781.apk
          echo 'b6e55392b63def4fe12bb50d554eda9e70c37ba0270b87c649495d405420246e  /tmp/r781.apk' | sha256sum -c -
          python3 - <<'PY'
          import zipfile,re
          z=zipfile.ZipFile('/tmp/r781.apk')
          for name in ['family-diary.js','moa-r697-vertical-calendar.js','moa-r755-inline-ai.js']:
              s=z.read('assets/web/'+name).decode()
              print('===',name,len(s))
              lines=s.splitlines()
              ranges={'family-diary.js':[(78,116),(150,165),(2185,2206)],'moa-r697-vertical-calendar.js':[(749,785),(1878,1902),(1920,1954),(2038,2072)],'moa-r755-inline-ai.js':[(1,16),(28,40),(98,108)]}[name]
              for a,b in ranges:
                  for i in range(a,b+1):
                      print(i,lines[i-1])
              if name=='family-diary.js':
                  for i,l in enumerate(lines,1):
                      if 'r98MountAppSettings' in l or ('settings' in l.lower() and 'append' in l and 'r98' in l): print(i,l)
          PY
