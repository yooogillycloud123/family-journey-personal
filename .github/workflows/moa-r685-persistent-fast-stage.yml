name: MOA R685 native fast-stage persistent ActionDeck DEX verify
on:
  push:
    branches: [feature/moa-r685-persist-fast-gallery-20261117]
    paths:
      - '.github/workflows/moa-r685-persistent-fast-stage.yml'
      - 'experiments/moa-r685/**'
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile original R463 deck with minimal persisted preference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/moa685/c17 /tmp/moa685/c19 /tmp/moa685/d17 /tmp/moa685/d19 build/moa-r685
          javac -encoding UTF-8 --release 8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/moa685/c17 experiments/moa-r685/MoaR391SessionPersistProvider.java
          find /tmp/moa685/c17 -name '*.class' -print0 | xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output /tmp/moa685/d17
          javac -encoding UTF-8 --release 8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/moa685/c19 experiments/moa-r685/MoaR675PickerGalleryDeck.java experiments/moa-r685/MoaR667NativePickerProvider.java
          find /tmp/moa685/c19 -name '*.class' -print0 | xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output /tmp/moa685/d19
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib,json
          root=Path('build/moa-r685'); info={}
          for n,p in [('17',Path('/tmp/moa685/d17/classes.dex')),('19',Path('/tmp/moa685/d19/classes.dex'))]:
              b=p.read_bytes();assert b.startswith(b'dex\n'),n
              assert b'r685FastWanted' in b and b'r685StoreFast' in b and b'r685RestoreFast' in b,n
              if n=='17':assert b'MoaR391SessionPersistProvider' in b and b'MoaNativeGallery' in b
              if n=='19':assert b'MoaR675PickerGalleryDeck' in b and b'MoaR667NativePickerProvider' in b and b'R685-DISTINCT-NATIVE-ONE-SWIPE-CACHED-RAIL' in b
              (root/f'classes{n}.dex.z.b64').write_text(base64.b64encode(zlib.compress(b,9)).decode()+'\n')
              info[n]={'size':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          (root/'compile_qa.json').write_text(json.dumps({'compiled':True,'sdk':'35','min_api':29,'persistent_fast_preference':'SharedPreferences commit','native_gallery_media_classes6_modified':False,'dex':info,'device_test':'NOT_PERFORMED'},indent=2))
          print((root/'compile_qa.json').read_text())
          PY
      - name: Recompile source-equivalent R683 baseline DEX for exact binary parity gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/moa685/base17src /tmp/moa685/base19src /tmp/moa685/base17class /tmp/moa685/base19class /tmp/moa685/base17dex /tmp/moa685/base19dex
          python3 - <<'PY'
          from pathlib import Path
          base=Path('experiments/moa-r685')
          s=(base/'MoaR391SessionPersistProvider.java').read_text()
          s=s.replace('  // R685: persistent USER preference, separate from temporary native stage cleanup.\n  private static final String GALLERY_FAST_PREFS="moa_r685_gallery_fast_stage_v1";\n','')
          start=s.index('  // R685: Auto-cleanup on gallery close must NOT overwrite the user preference.\n')
          end=s.index('  // Simple canvas strokes avoid device-font-dependent emoji/icon spacing.',start)
          s=s[:start]+s[end:]
          s=s.replace('if(entry.fastSwipeEnabled){r685StoreFast(a,false);r463DisableFastSwipe(entry);return;}','if(entry.fastSwipeEnabled){r463DisableFastSwipe(entry);return;}')
          s=s.replace('        r685StoreFast(a,true);\n','')
          s=s.replace('      r685RestoreFast(a,entry);\n','')
          assert 'r685Fast' not in s and 'r685RestoreFast' not in s and len(s)>74000
          Path('/tmp/moa685/base17src/MoaR391SessionPersistProvider.java').write_text(s)
          t=(base/'MoaR675PickerGalleryDeck.java').read_text()
          t=t.replace('  // Cross-gallery user-selected fast-stage setting, distinct from temporary cleanup.\n  private static final String GALLERY_FAST_PREFS="moa_r685_gallery_fast_stage_v1";\n','')
          start=t.index('  // Never save OFF when a Gallery Activity closes; retain only explicit user changes.\n')
          end=t.index('  // Simple canvas strokes avoid device-font-dependent emoji/icon spacing.',start)
          t=t[:start]+t[end:]
          t=t.replace('if(entry.fastSwipeEnabled){r685StoreFast(a,false);r463DisableFastSwipe(entry);return;}','if(entry.fastSwipeEnabled){r463DisableFastSwipe(entry);return;}')
          t=t.replace('        r685StoreFast(a,true);\n','')
          t=t.replace('      r685RestoreFast(a,entry);\n','')
          assert len(t)==72753,'Original R683 picker deck source character count'
          assert __import__('hashlib').sha256(t.encode()).hexdigest()=='7be5db169f289db108f99b147ea3e11b2944c7487b10ab4d353a70bb7d2c6e3f','Original R683 picker deck exact source SHA'
          Path('/tmp/moa685/base19src/MoaR675PickerGalleryDeck.java').write_text(t)
          u=(base/'MoaR667NativePickerProvider.java').read_text().replace('R685-DISTINCT-NATIVE-ONE-SWIPE-CACHED-RAIL','R683-DISTINCT-NATIVE-ONE-SWIPE-CACHED-RAIL')
          if not u.endswith('\n'):u+='\n'
          assert len(u)==24427
          assert __import__('hashlib').sha256(u.encode()).hexdigest()=='a628810122a36341e2d70dfcf3eb30c894193f74352128463ff22c5f6699f5fa'
          Path('/tmp/moa685/base19src/MoaR667NativePickerProvider.java').write_text(u)
          PY
          javac -encoding UTF-8 --release 8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/moa685/base17class /tmp/moa685/base17src/MoaR391SessionPersistProvider.java
          find /tmp/moa685/base17class -name '*.class' -print0 | xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output /tmp/moa685/base17dex
          javac -encoding UTF-8 --release 8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/moa685/base19class /tmp/moa685/base19src/MoaR675PickerGalleryDeck.java /tmp/moa685/base19src/MoaR667NativePickerProvider.java
          find /tmp/moa685/base19class -name '*.class' -print0 | xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output /tmp/moa685/base19dex
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib,hashlib,json
          p=Path('build/moa-r685')
          for n in ['17','19']:
            b=Path(f'/tmp/moa685/base{n}dex/classes.dex').read_bytes()
            (p/f'baseline{n}.dex.z.b64').write_text(base64.b64encode(zlib.compress(b,9)).decode()+'\n')
            print(f'BASELINE_{n}_DEX_SHA256=',hashlib.sha256(b).hexdigest(),'SIZE=',len(b))
          PY
      - name: Commit only compiled DEX (compressed base64), never any signer or photo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/moa-r685/classes17.dex.z.b64 build/moa-r685/classes19.dex.z.b64 build/moa-r685/compile_qa.json
          git commit -m "MOA R685: SDK35 verified DEX17/19 only (unsigned)" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MOA-R685-DEX17-19-ANDROID-SDK35
          path: build/moa-r685/
