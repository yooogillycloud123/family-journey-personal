name: MOA R91 temporary hidden-display feasibility APK
on:
  push:
    branches:
      - moa-r91-displaycheck
    paths:
      - 'experiments/r91/**'
      - '.github/workflows/moa-r91-display-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-readonly-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check pinned upstream SDK and isolate temporary diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/loyality7/headless-android-sdk.git /tmp/headless
          cd /tmp/headless
          actual="$(git rev-parse HEAD)"
          expected=7c5391f54cc581637a38656d5106ece6165b248c
          echo "SDK SHA $actual"
          test "$actual" = "$expected"
          cp "$GITHUB_WORKSPACE/experiments/r91/MainActivity.kt" example/src/main/java/com/headless/example/MainActivity.kt
          sed -i 's/applicationId "com.headless.example"/applicationId "com.headless.moa.r91probe"/' example/build.gradle
          sed -i 's/versionName "1.0"/versionName "R91-READONLY-PROBE"/' example/build.gradle
          sed -i 's/versionCode 1/versionCode 91/' example/build.gradle
          grep -q 'com.headless.moa.r91probe' example/build.gradle
          grep -q 'MOA R91' example/src/main/java/com/headless/example/MainActivity.kt
          test -s example/src/main/AndroidManifest.xml
      - name: Compile temporary diagnostic APK
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/headless
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :example:assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/r91_artifact"
          cp example/build/outputs/apk/debug/example-debug.apk "$GITHUB_WORKSPACE/r91_artifact/MOA_R91_HIDDEN_DISPLAY_READONLY_PROBE.apk"
          sha256sum "$GITHUB_WORKSPACE/r91_artifact/MOA_R91_HIDDEN_DISPLAY_READONLY_PROBE.apk" > "$GITHUB_WORKSPACE/r91_artifact/SHA256.txt"
          echo "R91_DIAGNOSTIC_BUILD=PASS" > "$GITHUB_WORKSPACE/r91_artifact/STATUS.txt"
      - name: Verify experimental APK package, signer and ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/r91_artifact/MOA_R91_HIDDEN_DISPLAY_READONLY_PROBE.apk"
          unzip -t "$APK" | tail -n 2
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$signer"
          test -n "$aapt"
          "$signer" verify --verbose "$APK"
          "$aapt" dump badging "$APK" | head -n 3
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: MOA-R91-READONLY-HEADLESS-DIAGNOSTIC
          path: r91_artifact/
          if-no-files-found: error
