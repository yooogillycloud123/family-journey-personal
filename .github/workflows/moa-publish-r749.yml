name: MOA R749 verified original photo server fix
on:
  push:
    branches: [moa-update-channel]
    paths: ['.github/workflows/moa-publish-r749.yml']
permissions:
  contents: write
concurrency:
  group: moa-update-channel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct exact locally signed APK
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,base64,pathlib,zipfile,io,struct,zlib
          p=pathlib.Path('android/releases')
          a=(p/'moa-r747.apk').read_bytes()
          assert hashlib.sha256(a).hexdigest()=='451e240d713ceacfbcb8ceb4157be7083ddea85e7f3898e49f94dc4b6040eaac'
          def manifest_record(a):
              z=zipfile.ZipFile(io.BytesIO(a)); i=z.getinfo('AndroidManifest.xml')
              raw=bytearray(z.read(i)); old='MOA-R747'.encode('utf-16le');assert raw.count(old)==1
              raw=raw.replace(old,'MOA-R749'.encode('utf-16le')); off=8;ids=[];changed=0
              while off<len(raw):
                  t,h,n=struct.unpack_from('<HHI',raw,off)
                  if t==0x180:ids=list(struct.unpack_from('<%dI'%((n-8)//4),raw,off+8))
                  if t==0x102:
                      ast,asz,ac=struct.unpack_from('<HHH',raw,off+24)
                      for j in range(ac):
                          q=off+16+ast+j*asz;_,idx,_,_,_,typ,val=struct.unpack_from('<IIIHBBI',raw,q)
                          if idx<len(ids) and ids[idx]==0x0101021b:
                              assert typ==0x10 and val==747;struct.pack_into('<I',raw,q+16,749);changed+=1
                  off+=n
              assert changed==1
              co=zlib.compressobj(9,zlib.DEFLATED,-15);comp=co.compress(raw)+co.flush()
              q=i.header_offset;nl,xl=struct.unpack_from('<HH',a,q+26)
              h=bytearray(a[q:q+30+nl+xl]);struct.pack_into('<III',h,14,zlib.crc32(raw)&0xffffffff,len(comp),len(raw))
              return bytes(h)+comp
          d=zlib.decompress(base64.b64decode('',validate=True))
          assert len(d)==3426
          i=0;out=bytearray()
          while i<len(d):
              op=d[i];i+=1
              if op==0:
                  s,n=struct.unpack_from('<II',d,i);i+=8;out.extend(a[s:s+n])
              elif op==1:
                  n=struct.unpack_from('<I',d,i)[0];i+=4;out.extend(d[i:i+n]);i+=n
              elif op==2:out.extend(manifest_record(a))
              else:raise ValueError(op)
          assert len(out)==10773412 and hashlib.sha256(out).hexdigest()=='3c1cab5a74d3896a71a7b8e41bf7c5e6d3d3833a73a10ddbb39c77803ec6c835', (len(out),zlib.ZLIB_RUNTIME_VERSION,hashlib.sha256(out).hexdigest())
          f=p/'moa-r749.apk';f.write_bytes(out)
          with zipfile.ZipFile(p/'moa-r747.apk') as old,zipfile.ZipFile(f) as new:
              assert new.testzip() is None and set(old.namelist())==set(new.namelist())
              assert {n for n in old.namelist() if old.read(n)!=new.read(n)}=={'AndroidManifest.xml','classes24.dex'}
          assert json.loads(pathlib.Path('android/latest.json').read_text())['versionCode']==747
          PY
          test "$(git hash-object android/releases/moa-r749.apk)" = 67c95e01bc09a747e06f7677d788881f4d06dd65
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(find "$SDK/build-tools" -name apksigner | sort -V | tail -1 | xargs dirname)"
          "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 29 android/releases/moa-r749.apk | tee /tmp/moa-cert
          grep -F 'certificate SHA-256 digest: 5a86862beacac780a83729f3c01584d6d0ea5be88cf51827cb0b257d9caa0f15' /tmp/moa-cert
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/moa-cert
          "$BT/aapt2" dump badging android/releases/moa-r749.apk > /tmp/moa-badging
          grep -F "package: name='com.juhyeon.familyjournea' versionCode='749'" /tmp/moa-badging
          "$BT/zipalign" -c 4 android/releases/moa-r749.apk
          python - <<'PY'
          import json,pathlib
          j={'packageName':'com.juhyeon.familyjournea','signerSha256':'5a86862beacac780a83729f3c01584d6d0ea5be88cf51827cb0b257d9caa0f15','versionCode':749,'bytes':10773412,'sha256':'3c1cab5a74d3896a71a7b8e41bf7c5e6d3d3833a73a10ddbb39c77803ec6c835','apkUrl':'https://raw.githubusercontent.com/yooogillycloud123/family-journey-personal/moa-update-channel/android/releases/moa-r749.apk','published':True,'notes':'R749 베타: 사진 원본 전송 서버 분기 수정. 기존 영상 및 스마트폰 기능 보존. 폰과 태블릿 모두 업데이트. 실기기 확인 필요.'}
          pathlib.Path('android/latest.json').write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Atomically publish exact APK and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/latest.json android/releases/moa-r749.apk
          git commit -m 'Publish exact original-signed MOA R749 photo server fix'
          git push origin HEAD:moa-update-channel
      - name: Verify public exact and nonce URLs and downloaded APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/verification
          python - <<'PY'
          import json,urllib.request,time,hashlib,subprocess,pathlib
          root='https://raw.githubusercontent.com/yooogillycloud123/family-journey-personal/'
          base=root+'moa-update-channel/android/latest.json'
          expected=json.loads(pathlib.Path('android/latest.json').read_text())
          out={}
          for attempt in range(13):
              out={}
              for label,url in [('exact',base),('nonce',base+'?moa_check='+str(time.time_ns())),('immutable',root+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()+'/android/latest.json')]:
                  try:
                      with urllib.request.urlopen(url,timeout=15) as r:
                          j=json.load(r);out[label]={'status':r.status,'versionCode':j.get('versionCode'),'matches':j==expected,'headers':{k:v for k,v in r.headers.items() if k.lower() in ('age','cache-control','x-cache','date','etag','x-served-by')}}
                  except Exception as e:out[label]={'error':str(e)}
              if all(x.get('matches') for x in out.values()):break
              if attempt<12:time.sleep(25)
          with urllib.request.urlopen(expected['apkUrl'],timeout=30) as r:
              b=r.read(12000000);out['apk']={'status':r.status,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          assert all(out[k].get('matches') for k in ('exact','nonce','immutable')),out
          assert out['apk']['bytes']==expected['bytes'] and out['apk']['sha256']==expected['sha256'],out
          pathlib.Path('android/verification/r749-public-endpoint.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          git add android/verification/r749-public-endpoint.json
          git commit -m 'Record R749 verified actual public update endpoint'
          git push origin HEAD:moa-update-channel
