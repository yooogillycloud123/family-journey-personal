name: MOA R633 original Gallery bottom selection QuickRecord isolated DEX compile
on:
  push:
    branches:
      - feature/moa-r633-r631-quickrecord-guard-native-bottom-select-20261116
    paths:
      - .github/workflows/moa-r631-picker-native.yml
      - experiments/moa-r631/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile_native_picker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install API35 and D8
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile R611 additive native Gallery with R631 picker-only selection overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/moa-r631 /tmp/moar631/classes /tmp/moar631/dex
          javac -encoding UTF-8 -source 17 -target 17 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/moar631/classes experiments/moa-r631/MoaR507InlineGalleryProvider.java
          find /tmp/moar631/classes -name 'MoaR507InlineGalleryProvider*.class' -print0 | xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output /tmp/moar631/dex
          cp /tmp/moar631/dex/classes.dex build/moa-r631/classes18.dex
          sha256sum build/moa-r631/classes18.dex | tee build/moa-r631/dex-sha256.txt
          sha256sum experiments/moa-r631/MoaR507InlineGalleryProvider.java > build/moa-r631/source-sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          b=Path('build/moa-r631/classes18.dex').read_bytes()
          assert b.startswith(b'dex\n') and b'MoaR507InlineGalleryProvider' in b
          assert b'r631ObservePicker' in b and b'r611RecheckAfterNaverAccess' in b and b'moa.picker.bottom.select.r633' in b
          assert len(b)<180000
          print('R633_NATIVE_BOTTOM_PICKER_DEX_COMPILE_PASS',len(b))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MOA-R633-R611-ADDITIVE-NATIVE-BOTTOM-SELECT-DEX
          path: build/moa-r631/
          if-no-files-found: error
