name: MOA R269 Android WebView Cross-Frame Actual Emulator
on:
  push:
    branches: [research/moa-r269-webview-kvm-frame-gate-20261110]
    paths: ['experiments/moa-r269-android-webview-frame-test/**','.github/workflows/moa-r269-android-webview-frame-test.yml']
  workflow_dispatch:
concurrency:
  group: moa-r269-webview-research
  cancel-in-progress: true
permissions: {contents: read, issues: write}
jobs:
  android_webview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Install Android SDK36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Grant KVM access to the Android emulator (fix verified prior boot failure)
        run: |
          set -euxo pipefail
          test -c /dev/kvm || { echo '::error::This runner has no /dev/kvm. No Android browser result can be inferred.'; exit 1; }
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm
      - name: Compile first-party WebView frame proof (NOT MOA RELEASE)
        run: gradle -p experiments/moa-r269-android-webview-frame-test --no-daemon :app:assembleDebug
      - name: Run real Android 35 emulator WebView with no account login
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-boot-timeout: 900
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048 -dns-server 8.8.8.8,1.1.1.1
          script: |
            set -eu
            mkdir -p /tmp/moa-r269-webview-qa
            adb logcat -c || true
            adb shell getprop net.dns1 || true
            adb shell ping -c 1 -W 2 example.com || true
            adb shell ping -c 1 -W 2 map.naver.com || true
            adb install experiments/moa-r269-android-webview-frame-test/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.juhyeon.moa.browserprobe/.ProbeActivity
            # Human-shaped input goes ONLY to the fully opaque MOA mock overlay at t=174s.
            # This cannot log in or write any NAVER account state.
            (sleep 174; adb shell input tap 200 200) &
            sleep 190
            adb logcat -d -v time -s MOA_WEBFRAME_PROBE:I AndroidRuntime:E > /tmp/moa-r269-webview-qa/filtered-logcat.txt || true
            adb exec-out screencap -p > /tmp/moa-r269-webview-qa/screen.png || true
            cat /tmp/moa-r269-webview-qa/filtered-logcat.txt
            grep -q 'DIRECT_PLACE_START' /tmp/moa-r269-webview-qa/filtered-logcat.txt || { echo '::error::Direct Place standalone stage never launched'; exit 1; }
            grep -Eq 'FRAME_CHILD|FRAME_TOP|MAIN_ERROR|WEBKIT_UNSUPPORTED|BLOCK_EXTERNAL' /tmp/moa-r269-webview-qa/filtered-logcat.txt || { echo '::error::No useful WebView frame or network error trace; gate OPEN'; exit 1; }
            grep -Eq 'FRAME_(TOP|CHILD) pcmap[.]place[.]naver[.]com saveCount=[1-9][0-9]*;bodyLen=[1-9]' /tmp/moa-r269-webview-qa/filtered-logcat.txt || { echo '::error::Real Place Save control was not detected; account writer gate remains OPEN'; exit 1; }
            grep -q 'ANON_SAVE_2X2' /tmp/moa-r269-webview-qa/filtered-logcat.txt || { echo '::error::Anonymous 2x2 Save-click probe was not executed'; exit 1; }
            grep -q 'NATIVE_TOUCH_SENT' /tmp/moa-r269-webview-qa/filtered-logcat.txt || { echo '::error::Own-WebView native touch could not be dispatched behind MOA cover'; exit 1; }
            grep -q 'NATIVE_TOUCH_POST_UI' /tmp/moa-r269-webview-qa/filtered-logcat.txt || { echo '::error::Missing post-touch UI evidence; not a NAVER write PASS'; exit 1; }
            grep -q 'MOA_COVER_CLICK' /tmp/moa-r269-webview-qa/filtered-logcat.txt || { echo '::error::Foreground MOA mock did not receive real Android input'; exit 1; }
            echo 'Android WebView actually started; examine public frame result. This is NOT an account save PASS.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MOA-R269-ANDROID-WEBVIEW-ACTUAL-EMULATOR-PUBLIC-NO-LOGIN
          path: |
            /tmp/moa-r269-webview-qa/*
            experiments/moa-r269-android-webview-frame-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Publish sanitized anonymous browser QA gates (never account-write PASS)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOG=/tmp/moa-r269-webview-qa/filtered-logcat.txt
          report=/tmp/moa-r269-sanitized-gates.md
          printf '%s\n' '### Android 35 anonymous research CI' > "$report"
          printf 'Run: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$report"
          printf '%s\n' 'Flags mean a tagged event appeared in the emulator log, NOT a verified NAVER account save.' >> "$report"
          for tag in DIRECT_PLACE_START FRAME_TOP FRAME_CHILD ANON_SAVE_2X2 ANON_POST_CLICK_UI NATIVE_TOUCH_FRESH_DOCUMENT MOA_COVER_ON NATIVE_TOUCH_SENT NATIVE_TOUCH_SKIPPED NATIVE_TOUCH_POST_UI MOA_COVER_CLICK AUTH_POPUP_REQUESTED MAIN_ERROR; do
            if [ -f "$LOG" ] && grep -q "$tag" "$LOG"; then result=OBSERVED; else result=NOT_OBSERVED; fi
            printf '%s: %s\n' "$tag" "$result" >> "$report"
          done
          printf '%s\n' 'NAVER personal authentication, folder creation, saved-place write and independent readback: UNVERIFIED.' >> "$report"
          gh issue comment 9 --repo "$GITHUB_REPOSITORY" --body-file "$report"
