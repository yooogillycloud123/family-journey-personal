name: MOA R269 Android WebView Cross-Frame Actual Emulator
on:
  push:
    branches: [research/moa-r269-webview-kvm-frame-gate-20261110]
    paths: ['experiments/moa-r269-android-webview-frame-test/**','.github/workflows/moa-r269-android-webview-frame-test.yml']
  workflow_dispatch:
concurrency:
  group: moa-r269-webview-research
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  android_webview:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.14.3'}
      - name: Install Android SDK36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - name: Grant KVM access to the Android emulator (fix verified prior boot failure)
        run: |
          set -euxo pipefail
          test -c /dev/kvm || { echo '::error::This runner has no /dev/kvm. No Android browser result can be inferred.'; exit 1; }
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm
      - name: Compile first-party WebView frame proof (NOT MOA RELEASE)
        run: gradle -p experiments/moa-r269-android-webview-frame-test --no-daemon :app:assembleDebug
      - name: Run real Android 35 emulator WebView with no account login
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-boot-timeout: 900
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 2048
          script: |
            set -eu
            mkdir -p /tmp/moa-r269-webview-qa
            adb logcat -c || true
            adb install experiments/moa-r269-android-webview-frame-test/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.juhyeon.moa.browserprobe/.ProbeActivity
            sleep 130
            adb logcat -d -v time -s MOA_WEBFRAME_PROBE:I AndroidRuntime:E > /tmp/moa-r269-webview-qa/filtered-logcat.txt || true
            adb exec-out screencap -p > /tmp/moa-r269-webview-qa/screen.png || true
            cat /tmp/moa-r269-webview-qa/filtered-logcat.txt
            grep -q 'DIRECT_PLACE_START' /tmp/moa-r269-webview-qa/filtered-logcat.txt || { echo '::error::Direct Place standalone stage never launched'; exit 1; }
            if ! grep -Eq 'FRAME_CHILD|FRAME_TOP|MAIN_ERROR|WEBKIT_UNSUPPORTED|BLOCK_EXTERNAL' /tmp/moa-r269-webview-qa/filtered-logcat.txt; then
              echo '::error::No useful WebView cross-frame result observed. Keep Android authenticated save gate OPEN.'
              exit 1
            fi
            echo 'Android WebView actually started; examine public frame result. This is NOT an account save PASS.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MOA-R269-ANDROID-WEBVIEW-ACTUAL-EMULATOR-PUBLIC-NO-LOGIN
          path: |
            /tmp/moa-r269-webview-qa/*
            experiments/moa-r269-android-webview-frame-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
