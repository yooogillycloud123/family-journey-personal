name: MOA R731 verified remote timeline beta publication
on:
  push:
    branches: [moa-update-channel]
    paths: ['.github/workflows/moa-publish-r731.yml', 'android/staging/r731/**']
permissions:
  contents: write
concurrency:
  group: moa-update-channel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact locally signed APK and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,base64,pathlib,zipfile
          p=pathlib.Path('android/releases')
          base=(p/'moa-r729.apk').read_bytes()
          assert hashlib.sha256(base).hexdigest()=='4e9ce60ccaa4fd884729588ee5cacca945358390be7f2edcdbfeec2b7d0f1070'
          j=json.loads(pathlib.Path('android/staging/r731/delta.json').read_text())
          assert j['versionCode']==731
          out=b''.join(base[s['copy'][0]:s['copy'][1]] if 'copy' in s else base64.b64decode(s['data'],validate=True) for s in j['delta'])
          assert len(out)==10721824 and hashlib.sha256(out).hexdigest()=='a4bf00146c22c8ff1eeed82f759326f3b0acf694af7262e51095704acd1fe02c'
          f=p/'moa-r731.apk'
          f.write_bytes(out)
          with zipfile.ZipFile(p/'moa-r729.apk') as a,zipfile.ZipFile(f) as b:
              assert b.testzip() is None and set(a.namelist())==set(b.namelist())
              assert {n for n in a.namelist() if a.read(n)!=b.read(n)}=={'AndroidManifest.xml','assets/web/app.js','assets/web/native.js','assets/web/family-diary.js','classes6.dex','assets/web/moa-r697-vertical-calendar.js','assets/web/moa-r697-media-tools.js','classes20.dex','assets/web/moa-r711-mailbox.js','assets/web/moa-r713-controls.js','classes22.dex','classes24.dex'}
          latest=pathlib.Path('android/latest.json')
          assert json.loads(latest.read_text())['versionCode']<731
          PY
          test "$(git hash-object android/releases/moa-r731.apk)" = 62cf299aa9b3bf02807a5be22194d71be5783ab5
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(find "$SDK/build-tools" -name apksigner | sort -V | tail -1 | xargs dirname)"
          "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 29 android/releases/moa-r731.apk | tee /tmp/moa-cert
          grep -F 'certificate SHA-256 digest: 5a86862beacac780a83729f3c01584d6d0ea5be88cf51827cb0b257d9caa0f15' /tmp/moa-cert
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/moa-cert
          "$BT/aapt2" dump badging android/releases/moa-r731.apk > /tmp/moa-badging
          grep -F "package: name='com.juhyeon.familyjournea' versionCode='731'" /tmp/moa-badging
          "$BT/zipalign" -c 4 android/releases/moa-r731.apk
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('android/latest.json')
          j={'packageName':'com.juhyeon.familyjournea','signerSha256':'5a86862beacac780a83729f3c01584d6d0ea5be88cf51827cb0b257d9caa0f15','versionCode':731,'bytes':10721824,'sha256':'a4bf00146c22c8ff1eeed82f759326f3b0acf694af7262e51095704acd1fe02c','apkUrl':'https://raw.githubusercontent.com/yooogillycloud123/family-journey-personal/moa-update-channel/android/releases/moa-r731.apk','published':True,'notes':'R731 베타: 원격 일기 달력·갤러리 연결, 원격 영상/음성 읽기, 지도 및 업데이트 조회 개선. 실기기 미검증 베타. 원본 복제 없음.'}
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Atomically activate verified APK and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r android/staging/r731
          git add android/latest.json android/releases/moa-r731.apk
          git commit -m 'Publish exact original-signed MOA R731 remote timeline beta'
          git push origin HEAD:moa-update-channel
