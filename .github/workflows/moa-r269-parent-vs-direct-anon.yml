name: MOA R269 NAVER real anonymous embedded vs standalone Save topology
on:
  push:
    branches: [research/moa-r269-webview-kvm-frame-gate-20261110]
    paths:
      - experiments/moa-r269-android-webview-frame-test/ci_compare_parent_vs_direct.py
      - .github/workflows/moa-r269-parent-vs-direct-anon.yml
  workflow_dispatch:
permissions: {contents: read, issues: write}
jobs:
  compare_real_first_party_public_ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install isolated public browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Compare real NAVER parent-child vs standalone Place anonymous trusted click
        run: python experiments/moa-r269-android-webview-frame-test/ci_compare_parent_vs_direct.py
      - name: Upload only public no-credentials proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MOA-R269-REAL-PUBLIC-PARENT-VS-DIRECT-ANON-PROOF
          path: MOA_R269_PARENT_VS_DIRECT_ANON_BROWSER_PROOF.json
          if-no-files-found: warn
      - name: Index anonymous pass or failure without private data
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '### R269 real NAVER anonymous embedded-vs-standalone A/B' > /tmp/r269_ab_gate.md
          echo "CI: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> /tmp/r269_ab_gate.md
          if [ -f MOA_R269_PARENT_VS_DIRECT_ANON_BROWSER_PROOF.json ]; then
            python - <<'PY' >> /tmp/r269_ab_gate.md
          import json
          j=json.load(open('MOA_R269_PARENT_VS_DIRECT_ANON_BROWSER_PROOF.json'))
          for r in j['results']:
              print(f"{r['case']}: place_dom={r.get('child_found')}; click={r.get('click_method','NONE')}; popup={r.get('popup_count','UNVERIFIED')}; login_text={(r.get('after') or {}).get('loginText','UNVERIFIED')}; iframe_attached={r.get('old_frame_still_attached','UNVERIFIED')}; visible_login={r.get('visible_login_ui_any_frame','UNVERIFIED')}; gate={r.get('failure_gate')}")
              print(f"trust_events={(r.get('after') or {}).get('events',[])}; parent_message_origins={r.get('parent_message_origins',[])}; frame_events={r.get('frame_events',[])}; frames_after={r.get('frames_after',[])}")
          print("No NAVER account login, write, folder creation or readback was performed. NEVER label this as saved.")
          PY
          else
            echo 'No artifact; browser test did not produce readable result.' >> /tmp/r269_ab_gate.md
          fi
          gh issue comment 9 --repo "$GITHUB_REPOSITORY" --body-file /tmp/r269_ab_gate.md
