name: MOA isolated AppFunctions lab
on:
  push:
    branches: [feature/moa-appfunctions-link-lab-20261128]
    paths:
      - 'experiments/moa-appfunctions-link-lab/**'
      - '.github/workflows/moa-appfunctions-link-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-37"
      - name: Test and assemble isolated package
        run: gradle -p experiments/moa-appfunctions-link-lab :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Collect build evidence
        run: |
          mkdir -p lab-output
          cp experiments/moa-appfunctions-link-lab/app/build/outputs/apk/debug/app-debug.apk lab-output/MOA_Link_Lab_debug.apk
          sha256sum lab-output/*.apk > lab-output/SHA256SUMS.txt
          cp -r experiments/moa-appfunctions-link-lab/app/build/test-results/testDebugUnitTest lab-output/test-results
          unzip -t lab-output/MOA_Link_Lab_debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: moa-appfunctions-link-lab
          path: lab-output
          if-no-files-found: error
