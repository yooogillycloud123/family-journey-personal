name: MOA R747 verified selected original photo beta publication
on:
  push:
    branches: [moa-update-channel]
    paths: ['.github/workflows/moa-publish-r747.yml', 'android/staging/r747/**']
permissions:
  contents: write
concurrency:
  group: moa-update-channel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact locally signed APK and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,base64,pathlib,zipfile
          p=pathlib.Path('android/releases')
          base=(p/'moa-r745.apk').read_bytes()
          assert hashlib.sha256(base).hexdigest()=='6e9a8b924553c638e2461350b20c19ffa84de11dbe66204f6124921192f1ae31'
          j=json.loads(pathlib.Path('android/staging/r747/delta.json').read_text())
          assert j['versionCode']==747
          out=b''.join(base[s['copy'][0]:s['copy'][1]] if 'copy' in s else base64.b64decode(s['data'],validate=True) for s in j['delta'])
          assert len(out)==10773404 and hashlib.sha256(out).hexdigest()=='451e240d713ceacfbcb8ceb4157be7083ddea85e7f3898e49f94dc4b6040eaac'
          f=p/'moa-r747.apk'
          f.write_bytes(out)
          with zipfile.ZipFile(p/'moa-r745.apk') as a,zipfile.ZipFile(f) as b:
              assert b.testzip() is None and set(a.namelist())==set(b.namelist())
              assert {n for n in a.namelist() if a.read(n)!=b.read(n)}=={'AndroidManifest.xml','classes6.dex','classes24.dex'}
          latest=pathlib.Path('android/latest.json')
          assert json.loads(latest.read_text())['versionCode']<747
          PY
          test "$(git hash-object android/releases/moa-r747.apk)" = 14e16f38123d06d2ad81460bc038dbed70458fcf
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(find "$SDK/build-tools" -name apksigner | sort -V | tail -1 | xargs dirname)"
          "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 29 android/releases/moa-r747.apk | tee /tmp/moa-cert
          grep -F 'certificate SHA-256 digest: 5a86862beacac780a83729f3c01584d6d0ea5be88cf51827cb0b257d9caa0f15' /tmp/moa-cert
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/moa-cert
          "$BT/aapt2" dump badging android/releases/moa-r747.apk > /tmp/moa-badging
          grep -F "package: name='com.juhyeon.familyjournea' versionCode='747'" /tmp/moa-badging
          "$BT/zipalign" -c 4 android/releases/moa-r747.apk
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('android/latest.json')
          j={'packageName':'com.juhyeon.familyjournea','signerSha256':'5a86862beacac780a83729f3c01584d6d0ea5be88cf51827cb0b257d9caa0f15','versionCode':747,'bytes':10773404,'sha256':'451e240d713ceacfbcb8ceb4157be7083ddea85e7f3898e49f94dc4b6040eaac','apkUrl':'https://raw.githubusercontent.com/yooogillycloud123/family-journey-personal/moa-update-channel/android/releases/moa-r747.apk','published':True,'notes':'R747 베타: 선택 사진 원본 우선 디코딩 및 실제 화면 반영 경로 수정. 기존 달력·영상 유지. 실기기 화질 미검증.'}
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Atomically activate verified APK and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r android/staging/r747
          git add android/latest.json android/releases/moa-r747.apk
          git commit -m 'Publish exact original-signed MOA R747 selected original photo beta'
          git push origin HEAD:moa-update-channel
