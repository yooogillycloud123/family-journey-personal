name: MOA R365 standalone native durable QuickRecord DEX
on:
  push:
    branches:
      - feature/moa-r365-durable-quick-hidden-bootstrap-20261112
    paths:
      - experiments/moa-r365/MoaR365CompanionProvider.java
      - .github/workflows/moa-r365-native-additive.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile additive provider only (never old MOA native recorder)
        run: |
          set -euo pipefail
          SM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p /tmp/r365/classes /tmp/r365/dex build/moa-r365
          javac -encoding UTF-8 -source 17 -target 17 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d /tmp/r365/classes \
            experiments/moa-r365/MoaR365CompanionProvider.java
          find /tmp/r365/classes -type f -name 'MoaR365CompanionProvider*.class' -print0 | \
            xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" \
            --min-api 29 --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output /tmp/r365/dex
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,zlib,base64,json
          data=Path("/tmp/r365/dex/classes.dex").read_bytes()
          assert data[:4]==b'dex\n' and b'MoaR365CompanionProvider' in data
          out=Path("build/moa-r365")
          (out/"provider.dex.z.b64").write_text(base64.b64encode(zlib.compress(data,9)).decode()+"\n")
          (out/"QA.json").write_text(json.dumps({
            "dex_sha256":hashlib.sha256(data).hexdigest(),
            "dex_bytes":len(data),
            "source_sha256":hashlib.sha256(Path("experiments/moa-r365/MoaR365CompanionProvider.java").read_bytes()).hexdigest(),
            "exact_original_activity_compiled":False},indent=2))
          print("R365_PROVIDER_COMPILE_PASS",len(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MOA-R365-EXTRA-DEX-NO-SIGNING-KEYS
          path: build/moa-r365/