name: MOA R584 R567 Golden rail reset + QuickRecord photo rebind
on:
  push:
    branches: ['feature/moa-r584-r582-r567-rail-quickrecord-rebind-20261115']
    paths:
      - 'experiments/moa-r507/MoaR507InlineGalleryProvider.java'
      - 'experiments/moa-r483/moa-r483-vertical-calendar.js'
      - 'experiments/moa-r483/moa-r483-vertical-calendar.css'
      - 'experiments/moa-r570/apk_assets/web/moa-r570-photo-favorites.js'
      - 'experiments/moa-r578/**'
      - 'experiments/moa-r584/**'
      - '.github/workflows/moa-r578-native-gallery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile_and_contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK35 and D8
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile only additive R578 in-card provider DEX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/moa584/classes /tmp/moa584/dex build/moa-r584
          javac -encoding UTF-8 -source 17 -target 17 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d /tmp/moa584/classes \
            experiments/moa-r507/MoaR507InlineGalleryProvider.java
          find /tmp/moa584/classes -name 'MoaR507InlineGalleryProvider*.class' -print0 | \
            xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 \
            --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output /tmp/moa584/dex
          cp /tmp/moa584/dex/classes.dex build/moa-r584/classes18.dex
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('build/moa-r584/classes18.dex');b=p.read_bytes()
          assert b[:3]==b'dex' and len(b)<200000
          data={'dex_bytes':len(b),'dex_sha256':hashlib.sha256(b).hexdigest(),'device_status':'NOT_TESTED','golden_native_17_dex':'FROZEN'}
          Path('build/moa-r584/manifest.json').write_text(json.dumps(data,indent=2))
          print(json.dumps(data))
          PY
      - name: JS and source regression contract
        shell: bash
        run: |
          set -euo pipefail
          node --check experiments/moa-r483/moa-r483-vertical-calendar.js
          node --check experiments/moa-r570/apk_assets/web/moa-r570-photo-favorites.js
          node experiments/moa-r572/QA/bridge_regression_r572.js
          python3 - <<'PY'
          from pathlib import Path
          java=Path('experiments/moa-r507/MoaR507InlineGalleryProvider.java').read_text()
          js=Path('experiments/moa-r483/moa-r483-vertical-calendar.js').read_text()
          css=Path('experiments/moa-r483/moa-r483-vertical-calendar.css').read_text()
          fav=Path('experiments/moa-r570/apk_assets/web/moa-r570-photo-favorites.js').read_text()
          assert 'r572FinishEntry' in java and 'r572SyncFastSetting' in java
          assert 'r570ApplyOrder' in java and 'fast.performClick()' in java
          assert 'moa.r572.photo.fast' in java and 'setRailExpanded(a,railExpanded)' in java
          assert 'moa-r572-video-active' in js and 'background:#38343a!important' in css
          assert 'moa-r572-toast-leave' in fav and 'toastTimer=setTimeout' in fav
          assert 'r570OpenFavorite' in java and 'updateVideoAmbient' in java
          assert 'r574PhotoRefreshAttempts' in java and 'deck.setBackgroundColor(Color.TRANSPARENT)' in java
          assert 'r578HydrateSelectedDay' in js and 'r580HydrateCalendarMonth' in js and 'r580SavedIds' in js
          assert 'r578RestoreGoldenPhotoCrop' in java and 'ImageView.ScaleType.CENTER_CROP' in java
          assert 'r578MissingPhotoId' in java and 'refreshOriginalMediaIfBlank(gallery)' in java
          assert 'r576TightenMeasuredRail' not in java
          assert 'lp.height=dp(a,expanded?137:82)' in java
          assert 'p.height=dp(a,137);lower.setLayoutParams(p)' in java
          assert 'lower.setTranslationY(desired)' not in java
          assert 'function r584RecoverGallery' in js and 'function r584RebindNative' in js
          assert "window.MoaR469SimpleDiary={recoverGallery:" in js
          assert 'parent.addView(poster' in java and 'texture.setOpaque(false)' in java
          assert 'R578: undo R570/R572 blanket video background removal' in css
          assert 'r570OpenFavorite' in java and 'r572SyncFastSetting' in java
          assert 'r572FirstPhotoPending=false' in java and 'r576TightenMeasuredRail' not in java
          # R580 user-device FAIL: waiting on original images[1].drawable hid the
          # ENTIRE native host (filmstrip + eight controls), and withheld JS ACK.
          attach=java.split('private void attachCard(',1)[1].split('private void r572FinishEntry(',1)[0]
          finish=java.split('private void r572FinishEntry(',1)[1].split('private void r572SyncFastSetting(',1)[0]
          assert 'r580PhotoPending' not in java and 'r580AwaitPhotoId' not in java
          assert 'actualMediaReady(gallery)' not in attach
          assert 'actualMediaReady(gallery)' not in finish
          assert 'if(y+h<0||y>root.getHeight())host.setVisibility(View.INVISIBLE);' in attach
          assert 'else host.setVisibility(View.VISIBLE);' in attach
          assert 'window.__moaR507NativeMounted&&window.__moaR507NativeMounted(true)' in finish
          assert 'r572NativeMountAck=true;' in finish
          assert 'nativeHost.setVisibility(View.INVISIBLE);' not in finish
          assert 'IDBKeyRange.bound' in js and 'setTimeout(()=>r578HydrateSelectedDay(true)' in js
          print('R584 R567 original filmstrip geometry restored; saved capture gallery rebind/manual repair and original mount ACK PASS')
          PY
      - name: Run original photo-card gallery recovery contract regression
        shell: bash
        run: |
          set -euo pipefail
          cp experiments/moa-r507/MoaR507InlineGalleryProvider.java build/moa-r584/MoaR507InlineGalleryProvider.java
          cp experiments/moa-r483/moa-r483-vertical-calendar.js build/moa-r584/moa-r483-vertical-calendar.js
          MOA_R584_ROOT="$PWD/build/moa-r584" node experiments/moa-r584/test_r584_contracts.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MOA-R584-classes18-DEX-and-QA
          path: build/moa-r584/
          if-no-files-found: warn
