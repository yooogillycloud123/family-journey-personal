name: Independent original UI Android host (public code only)
on:
  push:
    paths: ['androidHost/**', '.github/workflows/original-host-android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$TOOL" --licenses >/dev/null || true
          "$TOOL" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate MOA additive UI syntax and icon resource XML
        shell: bash
        run: |
          set -euo pipefail
          node --check androidHost/app/src/main/assets/moa-r32-ui.js
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for file in ('androidHost/app/src/main/res/values/styles.xml', 'androidHost/app/src/main/res/values-v31/styles.xml', 'androidHost/app/src/main/res/drawable/ic_family_journey_foreground.xml', 'androidHost/app/src/main/AndroidManifest.xml'):
              ET.parse(file)
          print('MOA syntax/XML PASS')
          PY
      - name: Compile native bridge host (no proprietary web)
        run: gradle -p androidHost --no-daemon :app:assembleDebug
      - name: Check signed host
        shell: bash
        run: |
          set -euo pipefail
          APK=androidHost/app/build/outputs/apk/debug/app-debug.apk
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: FamilyJourneyIndependentNativeHost-NO-WEB-ASSETS
          path: androidHost/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
