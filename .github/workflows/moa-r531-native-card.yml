name: MOA R531 Native Photo Card LAB compile and syntax QA
on:
  push:
    branches:
      - feature/moa-r531-card-gallery-ux-experiment-20261114
    paths:
      - experiments/moa-r483/moa-r483-vertical-calendar.js
      - experiments/moa-r483/moa-r483-vertical-calendar.css
      - experiments/moa-r507/MoaR507InlineGalleryProvider.java
      - .github/workflows/moa-r531-native-card.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: JS parse and R463 safety gates
        run: |
          set -euo pipefail
          node --check experiments/moa-r483/moa-r483-vertical-calendar.js
          python3 - <<'PY'
          from pathlib import Path
          js=Path("experiments/moa-r483/moa-r483-vertical-calendar.js").read_text()
          java=Path("experiments/moa-r507/MoaR507InlineGalleryProvider.java").read_text()
          css=Path("experiments/moa-r483/moa-r483-vertical-calendar.css").read_text()
          assert "window.__moaR531ShowAdvanced" in js
          assert "window.__moaR531AdvancedClosed" in js
          assert "fullNativeOpen=true" in java and "initialCardChromeHidden=true" in java
          assert "updateVideoAmbient" in java and "object-fit:contain!important" in css
          assert "window.__moaR527DayToken" in js
          assert "setRailExpanded" in java
          print("R531 SOURCE SAFETY CHECKS=PASS")
          PY
      - name: Compile additive R531 DEX
        run: |
          set -euo pipefail
          mkdir -p /tmp/moa531/classes /tmp/moa531/dex build/moa-r531
          javac -encoding UTF-8 -source 17 -target 17 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/moa531/classes experiments/moa-r507/MoaR507InlineGalleryProvider.java
          find /tmp/moa531/classes -name '*.class' -print0 | xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output /tmp/moa531/dex
          python3 - <<'PY'
          import pathlib,hashlib,json
          b=pathlib.Path("/tmp/moa531/dex/classes.dex").read_bytes()
          assert b.startswith(b"dex\n")
          assert b"MoaR507InlineGalleryProvider" in b
          pathlib.Path("build/moa-r531/native-dex-sha256.json").write_text(json.dumps({"sha256":hashlib.sha256(b).hexdigest(),"size":len(b)},indent=2))
          pathlib.Path("build/moa-r531/classes18.dex").write_bytes(b)
          print("MOA_R531_NATIVE_DEX_SHA256",hashlib.sha256(b).hexdigest())
          PY
      - name: Collect exact modified source bundle
        run: |
          set -euo pipefail
          cp experiments/moa-r483/moa-r483-vertical-calendar.js build/moa-r531/
          cp experiments/moa-r483/moa-r483-vertical-calendar.css build/moa-r531/
          cp experiments/moa-r507/MoaR507InlineGalleryProvider.java build/moa-r531/
          cp .github/workflows/moa-r531-native-card.yml build/moa-r531/
          sha256sum build/moa-r531/classes18.dex build/moa-r531/moa-r483-vertical-calendar.js build/moa-r531/moa-r483-vertical-calendar.css build/moa-r531/MoaR507InlineGalleryProvider.java > build/moa-r531/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MOA-R531-ADDITIVE-DEX-LAB
          path: build/moa-r531/
          if-no-files-found: error
