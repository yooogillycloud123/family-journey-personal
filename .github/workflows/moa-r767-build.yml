name: MOA R767 isolated candidate compile (no publish)
on:
  push:
    branches: [feature/moa-r767-multisubject-20261127]
    paths: ['.github/workflows/moa-r767-build.yml','experiments/moa-r767/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify source and compile exact candidate
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/r767/{source,classes,dex,out}
          cat experiments/moa-r767/native-{0,1,2,3}.b64 | base64 -d >/tmp/r767/source.zip
          echo '54d9ad543226c5283fabbce7b6774e25ffea3e383181eccfbe7e97ad8edb09af  /tmp/r767/source.zip' | sha256sum -c -
          unzip -q /tmp/r767/source.zip -d /tmp/r767/source
          cat experiments/moa-r767/web-{0,1}.b64 | base64 -d >/tmp/r767/web.z
          echo 'a46c68cc3bf3c0f3ce4967e01e90146621953991c665da70a75a699a6da95e17  /tmp/r767/web.z' | sha256sum -c -
          python -c "import zlib,pathlib; pathlib.Path('/tmp/r767/out/moa-r755-inline-ai.js').write_bytes(zlib.decompress(pathlib.Path('/tmp/r767/web.z').read_bytes()))"
          echo '7c58dd18b60ccb819c2bb8d184fdaa345cd41fd97799a0019e92f4d9fd577d96  /tmp/r767/out/moa-r755-inline-ai.js' | sha256sum -c -
          node --check /tmp/r767/out/moa-r755-inline-ai.js
          sdk="$ANDROID_HOME"
          android="$sdk/platforms/android-35/android.jar"
          d8="$(find "$sdk/build-tools" -name d8 | sort -V | tail -1)"
          javac --release 8 -encoding UTF-8 -cp "$android" -d /tmp/r767/classes /tmp/r767/source/*.java
          find /tmp/r767/classes -name '*.class' -print0 | xargs -0 "$d8" --min-api 29 --lib "$android" --output /tmp/r767/dex
          cp /tmp/r767/dex/classes.dex /tmp/r767/out/classes27.dex
          sha256sum /tmp/r767/out/* > /tmp/r767/out/SHA256SUMS.txt
          echo 'SDK35 javac/D8 + JS syntax; NOT SIGNED OR PUBLISHED; DEVICE PENDING' > /tmp/r767/out/status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: moa-r767-candidate-native-dex-qa
          path: /tmp/r767/out/
