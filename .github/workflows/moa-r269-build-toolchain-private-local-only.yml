name: MOA Android public build toolchain for PRIVATE local signing ONLY
on:
  push:
    branches: [research/moa-r269-webview-kvm-frame-gate-20261110]
    paths: ['.github/workflows/moa-r269-build-toolchain-private-local-only.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  prepare_public_tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install Android build tools (NO private APKs or keys)
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$SDKMANAGER" "build-tools;35.0.0"
          mkdir -p /tmp/moa-public-tools
          cp -a "$ANDROID_HOME/build-tools/35.0.0/apksigner" /tmp/moa-public-tools/
          cp -a "$ANDROID_HOME/build-tools/35.0.0/zipalign" /tmp/moa-public-tools/
          mkdir -p /tmp/moa-public-tools/lib
          cp -a "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/moa-public-tools/lib/
          if [ -d "$ANDROID_HOME/build-tools/35.0.0/lib64" ]; then cp -a "$ANDROID_HOME/build-tools/35.0.0/lib64" /tmp/moa-public-tools/; fi
          curl --fail --location --retry 3 --retry-delay 2 --max-time 120 \
            -o /tmp/moa-public-tools/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar
          java -jar /tmp/moa-public-tools/apktool.jar --version
          ls -lh /tmp/moa-public-tools/apktool.jar /tmp/moa-public-tools/lib/apksigner.jar
          echo 'PUBLIC TOOL BINARIES ONLY; no user APK, signing key or app source was uploaded'
      - uses: actions/upload-artifact@v4
        with:
          name: MOA-R269-PUBLIC-LOCAL-REBUILD-TOOLCHAIN-NO-PRIVATE-DATA
          path: /tmp/moa-public-tools/
          if-no-files-found: error
          retention-days: 5
