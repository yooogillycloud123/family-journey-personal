name: MOA R747 selected original photo rendering
on:
  push:
    branches: [feature/moa-r747-selected-original-photo-20261126]
    paths: ['experiments/moa-r747/**','.github/workflows/moa-r747-build.yml']
concurrency:
  group: moa-r747-native-gallery-build
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual Row and verify production schema
        shell: bash
        run: |
          set -euxo pipefail
          apk=android/releases/moa-r745.apk
          echo '6e9a8b924553c638e2461350b20c19ffa84de11dbe66204f6124921192f1ae31  android/releases/moa-r745.apk' | sha256sum -c -
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          android="$sdk/platforms/android-35/android.jar"
          d8="$(find "$sdk/build-tools" -name d8 | sort -V | tail -1)"
          mkdir -p /tmp/moa747/classes /tmp/moa747/test /tmp/moa747/dex /tmp/moa747/smali /tmp/moa747/out
          curl -fsSL --retry 2 https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/json.jar
          javac --release 8 -encoding UTF-8 -cp "$android" -d /tmp/moa747/classes experiments/moa-r747/MoaRemoteTimeline731.java experiments/moa-r747/MoaRangeCache735.java experiments/moa-r747/MoaDiskCache737.java experiments/moa-r747/MoaAdaptive739.java experiments/moa-r747/MoaTransport741.java experiments/moa-r747/MoaFeedback741.java experiments/moa-r747/MoaOriginal743.java
          javac --release 8 -encoding UTF-8 -cp "/tmp/json.jar:$android:/tmp/moa747/classes" -d /tmp/moa747/test experiments/moa-r747/Catalog733Test.java experiments/moa-r747/Range735Test.java experiments/moa-r747/Disk737Test.java experiments/moa-r747/Adaptive739Test.java experiments/moa-r747/Transport741Test.java experiments/moa-r747/Original743Test.java
          java -cp "/tmp/json.jar:$android:/tmp/moa747/classes:/tmp/moa747/test" com.juhyeon.familyjournea.Catalog733Test | tee /tmp/moa747/out/catalog-test.txt
          java -cp /tmp/moa747/classes:/tmp/moa747/test com.juhyeon.familyjournea.Range735Test | tee /tmp/moa747/out/range-test.txt
          java -cp /tmp/moa747/classes:/tmp/moa747/test com.juhyeon.familyjournea.Disk737Test | tee /tmp/moa747/out/disk-test.txt
          java -cp /tmp/moa747/classes:/tmp/moa747/test com.juhyeon.familyjournea.Adaptive739Test | tee /tmp/moa747/out/adaptive-test.txt
          java -cp /tmp/moa747/classes:/tmp/moa747/test com.juhyeon.familyjournea.Transport741Test | tee /tmp/moa747/out/transport-test.txt
          java -cp "/tmp/json.jar:$android:/tmp/moa747/classes:/tmp/moa747/test" com.juhyeon.familyjournea.Original743Test | tee /tmp/moa747/out/original-test.txt
          find /tmp/moa747/classes -name '*.class' -print0 | xargs -0 "$d8" --min-api 29 --lib "$android" --output /tmp/moa747/dex
          curl -fsSL --retry 2 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o /tmp/apktool.jar
          cat >/tmp/Disassemble.java <<'JAVA'
          import java.io.*;import java.nio.file.*;
          import com.android.tools.smali.dexlib2.Opcodes;
          import com.android.tools.smali.dexlib2.dexbacked.DexBackedDexFile;
          import com.android.tools.smali.baksmali.Baksmali;
          import com.android.tools.smali.baksmali.BaksmaliOptions;
          public class Disassemble{public static void main(String[] args)throws Exception{BaksmaliOptions o=new BaksmaliOptions();o.localsDirective=true;Baksmali.disassembleDexFile(new DexBackedDexFile(new Opcodes(26,-1),Files.readAllBytes(Paths.get(args[0])),0),new File(args[1]),2,o);}}
          JAVA
          cat >/tmp/Assemble.java <<'JAVA'
          import brut.androlib.src.SmaliBuilder;
          import com.android.tools.smali.dexlib2.Opcodes;
          import com.android.tools.smali.dexlib2.writer.builder.DexBuilder;
          import com.android.tools.smali.dexlib2.writer.io.FileDataStore;
          import java.io.*;import java.nio.file.*;
          public class Assemble{public static void main(String[] args)throws Exception{File root=new File(args[0]);SmaliBuilder b=new SmaliBuilder(root,26);DexBuilder dex=new DexBuilder(new Opcodes(26,-1));try(java.util.stream.Stream<Path> st=Files.walk(root.toPath())){for(Path p:(Iterable<Path>)st.filter(x->x.toString().endsWith(".smali")).sorted()::iterator)b.buildFile(root.toPath().relativize(p).toString(),dex);}dex.writeTo(new FileDataStore(new File(args[1])));}}
          JAVA
          javac -cp /tmp/apktool.jar /tmp/Disassemble.java /tmp/Assemble.java
          unzip -p "$apk" classes24.dex > /tmp/moa747/base.dex
          java -cp /tmp/apktool.jar:/tmp Disassemble /tmp/moa747/base.dex /tmp/moa747/smali/base
          java -cp /tmp/apktool.jar:/tmp Disassemble /tmp/moa747/dex/classes.dex /tmp/moa747/smali/new
          python - <<'PY'
          from pathlib import Path
          import re, shutil
          root=Path('/tmp/moa747/smali/base');new=Path('/tmp/moa747/smali/new')
          old=list(root.rglob('MoaRemoteTimeline731*.smali'))+list(root.rglob('MoaRangeCache735*.smali'))+list(root.rglob('MoaDiskCache737*.smali'))+list(root.rglob('MoaAdaptive739*.smali'))+list(root.rglob('MoaTransport741*.smali'))+list(root.rglob('MoaFeedback741*.smali'))+list(root.rglob('MoaOriginal743*.smali')); assert old
          for f in old:f.unlink()
          for f in new.rglob('*.smali'):
              target=root/f.relative_to(new)
              print('helper', f.relative_to(new), 'exists',target.exists())
              if target.exists():
                  assert target.read_bytes()==f.read_bytes(), ('existing shared class differs',str(target))
                  continue
              assert f.name.startswith(('MoaRemoteTimeline731','MoaRangeCache735','MoaDiskCache737','MoaAdaptive739','MoaTransport741','MoaFeedback741','MoaOriginal743')) or 'ExternalSynthetic' in f.name, f.name
              target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(f,target)
          p=next(root.rglob('MoaRemote721.smali'))
          assert '->captureCovers(' in p.read_text()
          p=next(root.rglob('MoaRemoteTimeline731.smali'))
          m=p.read_text()
          assert '->selectedPhoto' not in m or 'selectedPhoto(' in m
          assert 'const-wide/16' in m and 'galleryPhoto(' in m
          # R733 installer and all other server code preserved.
          p=next(root.rglob('MoaUpdate723.smali'));assert 'closeAfterCommit(' in p.read_text()
          p=next(root.rglob('MoaRemoteTimeline731.smali'));assert 'Lcom/juhyeon/familyjournea/MoaDiskCache737;' in p.read_text() and 'Lcom/juhyeon/familyjournea/MoaAdaptive739;' in p.read_text()
          Path('/tmp/moa747/out/integration-test.txt').write_text('PASS: R733 installer fix retained; native private disk cache wired to remote timeline. Device parity not verified.\n')
          PY
          java -cp /tmp/apktool.jar:/tmp Assemble /tmp/moa747/smali/base /tmp/moa747/out/classes24.dex
          sha256sum /tmp/moa747/out/classes24.dex
          unzip -p "$apk" classes6.dex > /tmp/moa747/base6.dex
          java -cp /tmp/apktool.jar:/tmp Disassemble /tmp/moa747/base6.dex /tmp/moa747/smali/gallery
          python - <<'PY'
          from pathlib import Path
          import re
          p=next(Path('/tmp/moa747/smali/gallery').rglob('MoaNativeGallery.smali'))
          s=p.read_text()
          old=s
          assert s.count('->galleryFocus(')==1 and s.count('->galleryClosed(')==1
          assert s.count('->galleryMotion(')==1
          assert s.count('->galleryMetrics(')==1
          assert s.count('->galleryPhoto(')==1
          a=s.index('.method private refreshPages()V');b=s.index('.end method',a);m=s[a:b]
          pos=m.rfind('    return-void')
          assert pos>=0
          hook='    invoke-static/range {p0 .. p0}, Lcom/juhyeon/familyjournea/MoaRemoteTimeline731;->selectedPhoto(Ljava/lang/Object;)V\n\n'
          s=s[:a]+m[:pos]+hook+m[pos:]+s[b:]
          assert s.count('->selectedPhoto(')==1 and s.replace(hook,'')==old
          p.write_text(s)
          Path('/tmp/moa747/out/gallery-hook-test.txt').write_text('PASS: one selected-photo promotion hook; original video, local photo, gestures and calendar paths unchanged. Actual Android rendering pending.\n')
          PY
          java -cp /tmp/apktool.jar:/tmp Assemble /tmp/moa747/smali/gallery /tmp/moa747/out/classes6.dex
          sha256sum /tmp/moa747/out/classes6.dex
      - uses: actions/upload-artifact@v4
        with:
          name: moa-r747-compiled-dex-and-qa
          path: /tmp/moa747/out/
