name: MOA Naver Background Engine R1 - source unit and Android source compile
on:
  push:
    branches: [feature/moa-r235-naver-background-real-favorites-engine-20261110]
    paths: ['experiments/moa-naver-background-r1/**','.github/workflows/moa-naver-background-r1-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/moa-naver-background-r1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python dependencies + Playwright chromium
        run: |
          python -m pip install -e '.[test]'
          python -m playwright install chromium --with-deps
      - name: Unit and mock Chromium UI tests (NO LIVE NAVER ACCOUNT)
        run: python -m pytest -q
      - name: Android SDK35 standalone bridge compile, no APK keys
        run: |
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p /tmp/moa-native-bridge-classes
          javac -encoding UTF-8 -source 17 -target 17 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d /tmp/moa-native-bridge-classes android_integration/MoaNaverBackgroundClient.java
          test -s /tmp/moa-native-bridge-classes/com/juhyeon/familyjourney/MoaNaverBackgroundClient.class