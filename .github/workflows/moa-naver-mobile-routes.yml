name: MOA NAVER mobile page access matrix — NO LOGIN / NO USER DATA
on:
  push:
    branches: [research/moa-native-automatic-naver-favorites-canonical-20261110]
    paths:
      - 'experiments/moa-naver-mobile-routes/**'
      - '.github/workflows/moa-naver-mobile-routes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public_mobile_routes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
      - name: Assert photo GPS → job identity/readback with no manual input
        run: node experiments/moa-naver-mobile-routes/test_autodraft.cjs
      - name: Compare Android-UA and desktop route behavior without NAVER login
        run: python experiments/moa-naver-mobile-routes/ci_probe.py
      - name: Inspect unauthenticated Place Save modal without account action
        run: python experiments/moa-naver-mobile-routes/ci_public_save_modal.py
      - name: Inspect public save element ancestry without login
        run: python experiments/moa-naver-mobile-routes/ci_public_save_dom_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MOA-NAVER-mobile-public-route-evidence-NO-AUTH
          path: |
            MOA_NAVER_MOBILE_ROUTES_NO_LOGIN_20261110.json
            MOA_NAVER_PUBLIC_SAVE_MODAL_NO_AUTH.json
            MOA_NAVER_PUBLIC_SAVE_DOM_AUDIT_NO_AUTH.json
          if-no-files-found: warn
