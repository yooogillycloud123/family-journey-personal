name: MOA R761 inline diary AI compile
on:
  push:
    branches: [feature/moa-r761-learning-audio-20261127]
    paths: ['.github/workflows/moa-r761-build.yml','experiments/moa-r761/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated inline controller
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/r761/{source,classes,dex,out}
          base64 -d experiments/moa-r761/native-source.b64 >/tmp/r761/source.zip
          echo 'a39e68f016eab3fce0091b51cac53ab74d35dc1c9e25251aab48e454de61daf2  /tmp/r761/source.zip' | sha256sum -c -
          unzip -q /tmp/r761/source.zip -d /tmp/r761/source
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          android="$sdk/platforms/android-35/android.jar"
          d8="$(find "$sdk/build-tools" -name d8 | sort -V | tail -1)"
          javac --release 8 -encoding UTF-8 -cp "$android" -d /tmp/r761/classes /tmp/r761/source/*.java
          find /tmp/r761/classes -name '*.class' -print0 | xargs -0 "$d8" --min-api 29 --lib "$android" --output /tmp/r761/dex
          cp /tmp/r761/dex/classes.dex /tmp/r761/out/classes27.dex
          git fetch --depth=1 origin moa-update-channel
          git show bd7934dac1e18629cc005a0121612007528aedc6:android/releases/moa-r759.apk >/tmp/r761/golden.apk
          echo '86174f8ed89622196ce446c6e9cfd42e1087b6dae8f165f4ca45d865ed5b2d44  /tmp/r761/golden.apk' | sha256sum -c -
          curl -fsSL --retry 2 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o /tmp/apktool.jar
          cat >/tmp/Disassemble.java <<'JAVA'
          import java.io.*;import java.nio.file.*;
          import com.android.tools.smali.dexlib2.Opcodes;
          import com.android.tools.smali.dexlib2.dexbacked.DexBackedDexFile;
          import com.android.tools.smali.baksmali.Baksmali;
          import com.android.tools.smali.baksmali.BaksmaliOptions;
          public class Disassemble{public static void main(String[] args)throws Exception{BaksmaliOptions o=new BaksmaliOptions();o.localsDirective=true;Baksmali.disassembleDexFile(new DexBackedDexFile(new Opcodes(26,-1),Files.readAllBytes(Paths.get(args[0])),0),new File(args[1]),2,o);}}
          JAVA
          cat >/tmp/Assemble.java <<'JAVA'
          import brut.androlib.src.SmaliBuilder;
          import com.android.tools.smali.dexlib2.Opcodes;
          import com.android.tools.smali.dexlib2.writer.builder.DexBuilder;
          import com.android.tools.smali.dexlib2.writer.io.FileDataStore;
          import java.io.*;import java.nio.file.*;
          public class Assemble{public static void main(String[] args)throws Exception{File root=new File(args[0]);SmaliBuilder b=new SmaliBuilder(root,26);DexBuilder dex=new DexBuilder(new Opcodes(26,-1));try(java.util.stream.Stream<Path> st=Files.walk(root.toPath())){for(Path p:(Iterable<Path>)st.filter(x->x.toString().endsWith(".smali")).sorted()::iterator)b.buildFile(root.toPath().relativize(p).toString(),dex);}dex.writeTo(new FileDataStore(new File(args[1])));}}
          JAVA
          javac -cp /tmp/apktool.jar /tmp/Disassemble.java /tmp/Assemble.java
          unzip -p /tmp/r761/golden.apk classes6.dex >/tmp/r761/base.dex
          java -cp /tmp/apktool.jar:/tmp Disassemble /tmp/r761/base.dex /tmp/r761/smali
          cp -r /tmp/r761/smali /tmp/r761/before
          python - <<'PY'
          from pathlib import Path
          import re
          p=next(Path('/tmp/r761/smali').rglob('MoaMomentAudioHostActivity.smali'))
          s=p.read_text()
          cls='Lcom/juhyeon/familyjourney/MoaMomentAudioHostActivity;'
          field=cls+'->moa761Foreground:Z'
          assert 'moa761Foreground' not in s
          assert '.super Lcom/juhyeon/familyjourney/MoaMomentVoiceHostActivity;' in s
          def inject(sig,code):
              global s
              m=re.search(r'(?ms)^\.method [^\n]* '+re.escape(sig)+r'\n.*?^\.end method',s)
              assert m,sig
              b=m.group()
              loc=re.search(r'(?m)^    \.locals (\d+)$',b)
              assert loc
              n=int(loc.group(1))
              assert n>=1 and n<12,(sig,n)
              b=b[:loc.end()]+'\n'+code+'\n'+b[loc.end():]
              s=s[:m.start()]+b+s[m.end():]
          inject('onResume()V','    const/4 v0, 0x1\n    iput-boolean v0, p0, '+field+'\n')
          inject('onPause()V','    const/4 v0, 0x0\n    iput-boolean v0, p0, '+field+'\n')
          for name in ('play','togglePlayback'):
              inject(name+'(Ljava/lang/String;Ljava/lang/String;)V','    iget-boolean v0, p0, '+field+'\n    if-nez v0, :moa761_foreground\n    return-void\n    :moa761_foreground\n')
          assert not re.search(r'(?m)^\.method .* onStop\(\)V$',s)
          pos=s.index('\n.method ')
          s=s[:pos]+'\n.field private moa761Foreground:Z\n'+s[pos:]
          s+='\n.method protected onStop()V\n    .locals 1\n    const/4 v0, 0x0\n    iput-boolean v0, p0, '+field+'\n    invoke-virtual {p0}, '+cls+'->r217StopPlayback()V\n    invoke-super {p0}, Lcom/juhyeon/familyjourney/MoaMomentVoiceHostActivity;->onStop()V\n    return-void\n.end method\n'
          p.write_text(s)
          PY
          java -cp /tmp/apktool.jar:/tmp Assemble /tmp/r761/smali /tmp/r761/out/classes6.dex
          java -cp /tmp/apktool.jar:/tmp Disassemble /tmp/r761/out/classes6.dex /tmp/r761/check
          python - <<'PY'
          from pathlib import Path
          import hashlib,struct,zlib,re,difflib
          a=Path('/tmp/r761/before');b=Path('/tmp/r761/check')
          files={p.relative_to(a) for p in a.rglob('*.smali')}
          assert files=={p.relative_to(b) for p in b.rglob('*.smali')}
          changed=[p for p in files if (a/p).read_bytes()!=(b/p).read_bytes()]
          assert len(changed)==1 and changed[0].name=='MoaMomentAudioHostActivity.smali',changed
          p=changed[0]
          old=(a/p).read_text();new=(b/p).read_text()
          def methods(x):
              return {m.group().splitlines()[0]:m.group() for m in re.finditer(r'(?ms)^\.method .*?^\.end method',x)}
          o,n=methods(old),methods(new)
          modified=[k for k in o if o[k]!=n.get(k)]
          assert len(modified)==4 and all(any(' '+v+'(' in k for v in ('onPause','onResume','play','togglePlayback')) for k in modified),modified
          assert len(n)==len(o)+1 and any(' onStop()V' in k for k in n.keys()-o.keys())
          Path('/tmp/r761/out/legacy-audio-diff.txt').write_text(''.join(difflib.unified_diff(old.splitlines(True),new.splitlines(True))))
          for p in Path('/tmp/r761/out').glob('*.dex'):
              d=p.read_bytes();assert d[:4]==b'dex\n' and hashlib.sha1(d[32:]).digest()==d[12:32] and zlib.adler32(d[12:])&0xffffffff==struct.unpack_from('<I',d,8)[0]
          PY
          sha256sum /tmp/r761/out/*.dex
          echo 'SDK35 javac + D8 compile PASS; physical account and media analysis NOT VERIFIED' > /tmp/r761/out/status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: moa-r761-native-dex-qa
          path: /tmp/r761/out/
