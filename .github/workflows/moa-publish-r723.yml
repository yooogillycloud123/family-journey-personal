name: MOA signed APK publication R723
on:
  push:
    branches: [moa-update-channel]
    paths: ['android/staging/r723/**', '.github/workflows/moa-publish-r723.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: moa-update-channel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and validate existing signed APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/releases
          cat android/staging/r723/part-*.b64 | base64 --decode > android/releases/moa-r723.apk
          echo '80f9b2a8bf9d969e6760eb4b35628815f5f03f71a0edb6eee63b1440bcf37741  android/releases/moa-r723.apk' | sha256sum -c -
          test "$(wc -c < android/releases/moa-r723.apk)" = 10058012
          test "$(git hash-object android/releases/moa-r723.apk)" = f1ba4b4d074e5c572a133614cd505cba6e8917e6
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          TOOL="$(find "$SDK/build-tools" -name apksigner | sort -V | tail -1)"
          test -x "$TOOL"
          "$TOOL" verify --print-certs android/releases/moa-r723.apk | tee /tmp/moa-cert
          grep -F 'Signer #1 certificate SHA-256 digest: 5a86862beacac780a83729f3c01584d6d0ea5be88cf51827cb0b257d9caa0f15' /tmp/moa-cert
          python -c 'import json; p="android/latest.json"; j=json.load(open(p)); j["published"]=True; open(p,"w").write(json.dumps(j,ensure_ascii=False,indent=2)+"\n")'
      - name: Atomically publish APK and enabled update manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r android/staging/r723
          git add android/latest.json android/releases/moa-r723.apk
          git commit -m 'Publish verified original-signed MOA R723 APK'
          git push origin HEAD:moa-update-channel
