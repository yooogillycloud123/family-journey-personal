name: MOA R755 inline diary AI compile
on:
  push:
    branches: [feature/moa-r755-inline-diary-ai-20261127]
    paths: ['.github/workflows/moa-r755-build.yml','experiments/moa-r755/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated inline controller
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/r755/{source,classes,dex,out}
          base64 -d experiments/moa-r755/native-source.b64 >/tmp/r755/source.zip
          echo '36a5f9013e12f29c4efab7d4bf3bd304013abf9b72ea48b43cf9e34d029cf88f  /tmp/r755/source.zip' | sha256sum -c -
          unzip -q /tmp/r755/source.zip -d /tmp/r755/source
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          android="$sdk/platforms/android-35/android.jar"
          d8="$(find "$sdk/build-tools" -name d8 | sort -V | tail -1)"
          javac --release 8 -encoding UTF-8 -cp "$android" -d /tmp/r755/classes /tmp/r755/source/*.java
          find /tmp/r755/classes -name '*.class' -print0 | xargs -0 "$d8" --min-api 29 --lib "$android" --output /tmp/r755/dex
          cp /tmp/r755/dex/classes.dex /tmp/r755/out/classes27.dex
          sha256sum /tmp/r755/out/classes27.dex
          echo 'SDK35 javac + D8 compile PASS; physical account and media analysis NOT VERIFIED' > /tmp/r755/out/status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: moa-r755-native-dex-qa
          path: /tmp/r755/out/
