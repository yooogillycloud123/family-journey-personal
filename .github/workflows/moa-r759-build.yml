name: MOA R759 inline diary AI compile
on:
  push:
    branches: [feature/moa-r759-real-response-media-20261127]
    paths: ['.github/workflows/moa-r759-build.yml','experiments/moa-r759/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated inline controller
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/r759/{source,classes,dex,out}
          base64 -d experiments/moa-r759/native-source.b64 >/tmp/r759/source.zip
          echo 'fb41c74ffd7e2cdcf79dce8f2e1416e16aab09d336320e8a25b6b75f4ad592e6  /tmp/r759/source.zip' | sha256sum -c -
          unzip -q /tmp/r759/source.zip -d /tmp/r759/source
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          android="$sdk/platforms/android-35/android.jar"
          d8="$(find "$sdk/build-tools" -name d8 | sort -V | tail -1)"
          javac --release 8 -encoding UTF-8 -cp "$android" -d /tmp/r759/classes /tmp/r759/source/*.java
          find /tmp/r759/classes -name '*.class' -print0 | xargs -0 "$d8" --min-api 29 --lib "$android" --output /tmp/r759/dex
          cp /tmp/r759/dex/classes.dex /tmp/r759/out/classes27.dex
          sha256sum /tmp/r759/out/classes27.dex
          echo 'SDK35 javac + D8 compile PASS; physical account and media analysis NOT VERIFIED' > /tmp/r759/out/status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: moa-r759-native-dex-qa
          path: /tmp/r759/out/
