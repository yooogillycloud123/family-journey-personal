name: MOA R705 R703-preserving Gallery first-last native DEX17
on:
  push:
    branches:
      - feature/moa-r705-r703-native-gallery-first-last-20261121
    paths:
      - "experiments/moa-r697/MoaR391SessionPersistProvider.java"
      - ".github/workflows/moa-r705-gallery-first-last-compile.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK35
        run: |
          set -euo pipefail
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
      - name: Source invariants and preservation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('experiments/moa-r697/MoaR391SessionPersistProvider.java').read_text(encoding='utf-8')
          assert 'private static void r705JumpBoundary(' in s
          fn=s.split('private static void r705JumpBoundary(',1)[1].split('private static final class R705EdgeGlyph',1)[0]
          assert 'r203ReleaseWithVelocity' in fn and '(float)target,0f,1f' in fn
          for forbidden in ('openDay(', 'gallery.close(', 'delete(', 'removeFromNative(', 'setStreamVolume('):
            assert forbidden not in fn, forbidden
          assert 'r705SetEdgeVisible(e,false)' in s
          assert 'r705SetEdgeVisible(e,true)' in s
          assert 'inline?9:8' in s and 'inline?9:6' not in s
          for x in ('moa.gallery.action.first.r705','moa.gallery.action.last.r705',
                    'case "first":return "첫 사진으로"','case "last":return "마지막 사진으로"',
                    'r694SavedOrder','r694OrderDialog','r694MoveOrder',
                    'r703SyncEffectiveSilenceGlyph','r703MapCheck',
                    'r701ApplyGalaxyVolumeUnified','R697_NATIVE_MULTI_SELECTOR'):
            assert x in s,x
          assert 'r705UpdateEdgeState(a,entry);' in s
          assert 'firstJump.setOnClickListener' in s
          assert 'lastJump.setOnClickListener' in s
          assert 'r694EnsureFullscreenCover(a,e)' in s
          print('R705 R703 PRESERVATION + FULLSCREEN ICON REGISTRY + DIRECT NAVIGATION STATIC PASS')
          PY
      - name: Compile isolated DEX17
        run: |
          set -euo pipefail
          mkdir -p /tmp/moa705/classes /tmp/moa705/dex build/moa-r705
          LIB="$ANDROID_HOME/platforms/android-35/android.jar"
          javac -encoding UTF-8 --release 8 -cp "$LIB" -d /tmp/moa705/classes experiments/moa-r697/MoaR391SessionPersistProvider.java
          find /tmp/moa705/classes -name '*.class' -print0 | xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 --lib "$LIB" --output /tmp/moa705/dex
          cp /tmp/moa705/dex/classes.dex build/moa-r705/classes17.dex
          cp experiments/moa-r697/MoaR391SessionPersistProvider.java build/moa-r705/MoaR391SessionPersistProvider.java
          python3 - <<'PY'
          import hashlib,json,zlib,struct
          from pathlib import Path
          dex=Path('build/moa-r705/classes17.dex').read_bytes()
          assert dex[:4]==b'dex\\n',dex[:8]
          assert len(dex)<220000
          for token in (b'r705JumpBoundary',b'R705EdgeGlyph',
                        b'r703SyncEffectiveSilenceGlyph',b'r701ApplyGalaxyVolumeUnified'):
            assert token in dex,token
          assert dex[8:12]==struct.pack('<I',zlib.adler32(dex[12:])&0xffffffff)
          assert dex[12:32]==hashlib.sha1(dex[32:]).digest()
          data={
            'r705_native_dex17':hashlib.sha256(dex).hexdigest(),
            'dex17_bytes':len(dex),
            'sdk35_java_d8':'PASS',
            'source':'experiments/moa-r697/MoaR391SessionPersistProvider.java',
            'base_apk':'R703 code703 original-signed BETA, immutable',
            'release_candidate_code':705,
            'higher_version_r703_functional_recovery_code':706,
            'original_gallery_classes6':'UNCHANGED (do not rebuild)',
            'original_photo_host_classes18':'UNCHANGED (do not rebuild)',
            'only_requested_change':'fullscreen PHOTO and DETAIL first/last actions and order registry',
            'original_signed_installable_apk':'NOT_BUILT_BY_PUBLIC_CI_PRIVATE_SIGNER_NOT_PRESENT',
            'device_validation':'NOT_PERFORMED'
          }
          Path('build/moa-r705/CI_RESULT.json').write_text(json.dumps(data,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps(data,indent=2,ensure_ascii=False))
          PY
          sha256sum build/moa-r705/classes17.dex build/moa-r705/MoaR391SessionPersistProvider.java > build/moa-r705/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MOA-R705-GALLERY-FIRST-LAST-DEX17-SDK35-QA
          path: build/moa-r705
