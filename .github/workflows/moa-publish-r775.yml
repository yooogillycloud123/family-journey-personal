name: MOA R775 verified Plus learning native beta publication
on:
  push:
    branches: [moa-update-channel]
    paths: ['.github/workflows/moa-publish-r775.yml']
permissions:
  contents: write
concurrency:
  group: moa-update-channel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact signed APK and verify original signer and scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,struct,zlib,pathlib,json,zipfile
          p=pathlib.Path('android/releases')
          base=(p/'moa-r773.apk').read_bytes()
          assert hashlib.sha256(base).hexdigest()=='09b89a6560951ce12eade725a474b6a4cdf74f51842e998c686aa56153d7630b'
          d=zlib.decompress(base64.b64decode(''.join(pathlib.Path(f'android/staging/r775/delta{i}.b64').read_text() for i in range(4)),validate=True))
          assert len(d)==215982 and hashlib.sha256(d).hexdigest()=='e62fd5723a1dd22a6c87e4331558592a5378883666a6be7295c7b96fecda58ab'
          i=0;out=bytearray()
          while i<len(d):
              op=d[i];i+=1
              if op==0:
                  s,n=struct.unpack_from('<II',d,i);i+=8
                  assert s+n<=len(base)
                  out.extend(base[s:s+n])
              elif op==1:
                  n=struct.unpack_from('<I',d,i)[0];i+=4
                  assert i+n<=len(d)
                  out.extend(d[i:i+n]);i+=n
              else:raise ValueError(op)
          assert len(out)==10987920 and hashlib.sha256(out).hexdigest()=='81254675a8a8efe3f135514ec17f13e6885ec4e523918e5c19fef0fce1f38c27'
          f=p/'moa-r775.apk';f.write_bytes(out)
          with zipfile.ZipFile(p/'moa-r773.apk') as old,zipfile.ZipFile(f) as new:
              assert new.testzip() is None
              assert hashlib.sha256(new.read('assets/web/family-diary.js')).hexdigest()=='9cf61830896f2006752826875fc7f84c9f0e9db32ef4f5638700bbaa7647755c'
              assert hashlib.sha256(new.read('classes27.dex')).hexdigest()=='27fc684edce24e258c80678c4027c8ddc72adb2454f7a9d6212d3b43a083a0eb'
              assert hashlib.sha256(new.read('assets/web/moa-r755-inline-ai.js')).hexdigest()=='e2117d06d067bc9788e92a276530cc193e8f15a5ddcc484b9983d52a5113eb55'
              assert hashlib.sha256(new.read('assets/web/moa-r697-vertical-calendar.js')).hexdigest()=='1733f8f2f481d03deaa43a759b5f66353d6c566c9785fdbd8218a43c9029ba5d'
              assert set(new.namelist())==set(old.namelist())
              assert {n for n in old.namelist() if old.read(n)!=new.read(n)}=={'AndroidManifest.xml','classes27.dex','assets/web/moa-r755-inline-ai.js'}
              for n in new.namelist():
                  if n.endswith('.dex'):
                      b=new.read(n);assert b[:4]==b'dex\n' and hashlib.sha1(b[32:]).digest()==b[12:32] and zlib.adler32(b[12:])&0xffffffff==struct.unpack_from('<I',b,8)[0]
              assert b'<script src="moa-r751-studio.js"></script>' not in new.read('assets/web/index.html')
          assert json.loads(pathlib.Path('android/latest.json').read_text())['versionCode']==773
          PY
          test "$(git hash-object android/releases/moa-r775.apk)" = c01dccb5e9502f0bb490c36c671d645a52b674b6
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(find "$SDK/build-tools" -name apksigner | sort -V | tail -1 | xargs dirname)"
          "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 29 android/releases/moa-r775.apk | tee /tmp/moa-cert
          grep -F 'certificate SHA-256 digest: 5a86862beacac780a83729f3c01584d6d0ea5be88cf51827cb0b257d9caa0f15' /tmp/moa-cert
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/moa-cert
          "$BT/aapt2" dump badging android/releases/moa-r775.apk > /tmp/moa-badging
          grep -F "package: name='com.juhyeon.familyjournea' versionCode='775'" /tmp/moa-badging
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml android/releases/moa-r775.apk > /tmp/moa-manifest
          grep -F 'com.juhyeon.familyjournea.ai.MoaAiActivity' /tmp/moa-manifest
          grep -F 'android.intent.action.TTS_SERVICE' /tmp/moa-manifest
          "$BT/zipalign" -c 4 android/releases/moa-r775.apk
          python - <<'PY'
          import json,pathlib
          j={'packageName':'com.juhyeon.familyjournea','signerSha256':'5a86862beacac780a83729f3c01584d6d0ea5be88cf51827cb0b257d9caa0f15','versionCode':775,'bytes':10987920,'sha256':'81254675a8a8efe3f135514ec17f13e6885ec4e523918e5c19fef0fce1f38c27','apkUrl':'https://raw.githubusercontent.com/yooogillycloud123/family-journey-personal/moa-update-channel/android/releases/moa-r775.apk','published':True,'notes':'R775 베타: 학습 도구 모음 정렬, 단어별 저장 및 영상, 문장 번역 펼치기, 연결 탐구 화면 개선. 실기기 검증 대기.'}
          pathlib.Path('android/latest.json').write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Atomically activate exact verified APK and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r android/staging/r775
          git add android/latest.json android/releases/moa-r775.apk
          git commit -m 'Publish exact original-signed MOA R775 Plus learning native beta'
          git push origin HEAD:moa-update-channel
      - name: Verify actual public URLs and APK download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/verification
          python - <<'PY'
          import json,urllib.request,time,hashlib,subprocess,pathlib
          root='https://raw.githubusercontent.com/yooogillycloud123/family-journey-personal/'
          base=root+'moa-update-channel/android/latest.json'
          expected=json.loads(pathlib.Path('android/latest.json').read_text())
          out={}
          for attempt in range(13):
              out={}
              for label,url in [('exact',base),('nonce',base+'?moa_check='+str(time.time_ns())),('immutable',root+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()+'/android/latest.json')]:
                  try:
                      with urllib.request.urlopen(url,timeout=15) as r:
                          j=json.load(r);out[label]={'status':r.status,'versionCode':j.get('versionCode'),'matches':j==expected,'headers':{k:v for k,v in r.headers.items() if k.lower() in ('age','cache-control','x-cache','date','etag','x-served-by')}}
                  except Exception as e:out[label]={'error':str(e)}
              if all(x.get('matches') for x in out.values()):break
              if attempt<12:time.sleep(25)
          with urllib.request.urlopen(expected['apkUrl'],timeout=30) as r:
              b=r.read(12000000);out['apk']={'status':r.status,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          assert all(out[k].get('matches') for k in ('exact','nonce','immutable')),out
          assert out['apk']['bytes']==expected['bytes'] and out['apk']['sha256']==expected['sha256'],out
          pathlib.Path('android/verification/r775-public-endpoint.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          git add android/verification/r775-public-endpoint.json
          git commit -m 'Record R775 verified actual public update endpoint'
          git push origin HEAD:moa-update-channel
