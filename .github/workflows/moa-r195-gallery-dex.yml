name: MOA R195 compact video strip / active playback progress DEX
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/moa-r195-clean-controls-24h-sticky-audio-jump-video-rail-20261108
      - feature/moa-r197-gallery-transition-voice-sheet-sticky-sharp-day-20261108
      - feature/moa-r201-samsung-video-controls-rail-tapfix-20261108
      - feature/moa-r203-compact-center-pill-native-inertia-fling-20261109
      - feature/moa-r205-gallery-golden-polish-wave-preview-20261109
    paths:
      - 'experiments/moa-r175/MoaNativeGallery.java'
      - 'experiments/moa-r175/MoaMomentAudioHostActivity_native_unified_gallery.java.txt'
      - '.github/workflows/moa-r195-gallery-dex.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gallery_dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: R197 gallery regression contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'r197ScrubExpansion' experiments/moa-r175/MoaNativeGallery.java
          grep -q 'r197CenterTapPending' experiments/moa-r175/MoaNativeGallery.java
          grep -q 'r203ReleaseWithVelocity' experiments/moa-r175/MoaNativeGallery.java
          grep -q 'centerPill.setOnClickListener' experiments/moa-r175/MoaNativeGallery.java
          grep -q 'android.widget.OverScroller' experiments/moa-r175/MoaNativeGallery.java
          grep -q 'r205ShowCapturePreview' experiments/moa-r175/MoaNativeGallery.java
          grep -q 'r205PressFeedback' experiments/moa-r175/MoaNativeGallery.java
          grep -q 'r205WavePhase' experiments/moa-r175/MoaNativeGallery.java
          grep -q 'texture.setAlpha(0f)' experiments/moa-r175/MoaNativeGallery.java
          if grep -q 'getWidth()\*videoProgress' experiments/moa-r175/MoaNativeGallery.java; then
            echo 'ERROR: full-rail white cursor must NOT return'; exit 1
          fi
      - name: Compile isolated exact R195 native host and gallery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/moa195/src/com/juhyeon/familyjourney /tmp/moa195/classes /tmp/moa195/dex build/moa-r195
          cp experiments/moa-r175/MoaMomentAudioHostActivity_native_unified_gallery.java.txt /tmp/moa195/src/com/juhyeon/familyjourney/MoaMomentAudioHostActivity.java
          cp experiments/moa-r175/MoaNativeGallery.java /tmp/moa195/src/com/juhyeon/familyjourney/MoaNativeGallery.java
          cat > /tmp/moa195/src/com/juhyeon/familyjourney/MoaMomentVoiceHostActivity.java <<'JAVA'
          package com.juhyeon.familyjourney;
          class MoaMomentVoiceHostActivity extends android.app.Activity {}
          JAVA
          javac -encoding UTF-8 -source 17 -target 17 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/moa195/classes /tmp/moa195/src/com/juhyeon/familyjourney/*.java > build/moa-r195/compile.log 2>&1 || { cat build/moa-r195/compile.log; exit 1; }
          find /tmp/moa195/classes -type f \( -name 'MoaMomentAudioHostActivity*.class' -o -name 'MoaNativeGallery*.class' \) -print0 |
            xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output /tmp/moa195/dex >> build/moa-r195/compile.log 2>&1 || { cat build/moa-r195/compile.log; exit 1; }
          python3 - <<'PY'
          import pathlib,hashlib,zlib,base64,json
          b=pathlib.Path('/tmp/moa195/dex/classes.dex').read_bytes()
          assert b.startswith(b'dex\n') and b'MoaNativeGallery' in b and b'MoaMomentAudioHostActivity' in b
          q=pathlib.Path('build/moa-r195')
          (q/'classes6.dex.z.b64').write_text(base64.b64encode(zlib.compress(b,9)).decode()+'\n')
          (q/'manifest.json').write_text(json.dumps({'dex_sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'gallery_source_sha256':hashlib.sha256(pathlib.Path('experiments/moa-r175/MoaNativeGallery.java').read_bytes()).hexdigest(),'status':'isolated_compile_only; no full signed APK or physical device claim'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MOA-R197-NATIVE-GALLERY-DEX
          path: build/moa-r195/
