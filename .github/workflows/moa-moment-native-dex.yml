name: MOA moment native bridge DEX
on:
  push:
    branches:
      - main
    paths:
      - 'android/app/src/main/java/com/juhyeon/familyjourney/**'
      - '.github/workflows/moa-moment-native-dex.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Java, then only new native classes to DEX
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon :app:compileDebugJavaWithJavac
          mkdir -p build/moa-moment-r43
          CLASSES="$(find android/app/build -name MoaMomentCaptureService.class -printf '%h\n' | head -1)"
          test -n "$CLASSES"
          test -s "$CLASSES/MoaMomentApplication.class"
          test -s "$CLASSES/MoaMomentSetupActivity.class"
          test -s "$CLASSES/MoaMomentMemoActivity.class"
          mkdir -p /tmp/nativeout
          find "$CLASSES" -maxdepth 1 -name 'MoaMoment*.class' ! -name 'MoaMomentHostActivity*' -print0 | xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output /tmp/nativeout
          test -s /tmp/nativeout/classes.dex
          python3 - <<'PY'
          import pathlib,hashlib,base64,zlib,json
          b=pathlib.Path('/tmp/nativeout/classes.dex').read_bytes()
          assert b'MoaMomentCaptureService' in b and b'MoaMomentApplication' in b and b'MoaMomentMemoActivity' in b and b'MoaMomentSetupActivity' in b
          assert b'MoaMomentHostActivity' not in b  # Preserve existing final HostActivity untouched
          p=pathlib.Path('build/moa-moment-r43')
          (p/'native.dex.z.b64').write_text(base64.b64encode(zlib.compress(b,9)).decode()+'\n')
          (p/'manifest.json').write_text(json.dumps({'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b)},indent=2))
          PY
      - name: Commit compiled DEX base64 as verified artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f build/moa-moment-r43/native.dex.z.b64 build/moa-moment-r43/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Verified R43 native DEX toolchain output"
            git push origin HEAD:main || echo 'Concurrent commit detected: compiled DEX remains available as workflow artifact'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MOA-R43-native-classes-Dex
          path: build/moa-moment-r43

  r161_photo_memo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/moa-r161-capture-record-stt-20261107
      - name: R161 CI handshake before compile
        run: |
          set -euo pipefail
          mkdir -p build/moa-r161-native
          echo "R161_GITHUB_RUN_STARTED" > build/moa-r161-native/status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f build/moa-r161-native/status.txt
          git commit -m "ci(moa-r161): runner started" || true
          git push origin HEAD:feature/moa-r161-capture-record-stt-20261107 || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile isolated R161 new Activity
        continue-on-error: true
        run: |
          set -euo pipefail
          gradle -p android --no-daemon :app:compileDebugJavaWithJavac > build/moa-r161-native/compile.log 2>&1 || { tail -80 build/moa-r161-native/compile.log; exit 1; }
          C="$(find android/app/build -type f -name 'MoaMomentMemoRecorderActivity.class' -printf '%h\n' | head -1)"
          test -n "$C"
          mkdir -p /tmp/moa-r161-dex build/moa-r161-native
          find "$C" -maxdepth 1 -name 'MoaMomentMemoRecorderActivity*.class' -print0 | xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output /tmp/moa-r161-dex
          python3 - <<'PY'
          import pathlib,base64,zlib,json,hashlib
          b=pathlib.Path('/tmp/moa-r161-dex/classes.dex').read_bytes()
          assert b.startswith(b'dex\n')
          assert b'MoaMomentMemoRecorderActivity' in b
          assert b'MoaMomentMemoActivity;' not in b
          d=pathlib.Path('build/moa-r161-native')
          (d/'memo-recorder.dex.z.b64').write_text(base64.b64encode(zlib.compress(b,9)).decode()+'\n')
          (d/'manifest.json').write_text(json.dumps({'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()},indent=2))
          PY
      - name: Save R161 compiler diagnosis
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -f build/moa-r161-native/compile.log || echo "Compile step did not create a log" > build/moa-r161-native/compile.log
          tail -150 build/moa-r161-native/compile.log > build/moa-r161-native/compile-tail.txt
          git add -f build/moa-r161-native/compile-tail.txt
          git commit -m "ci(moa-r161): compile diagnostics" || true
          git push origin HEAD:feature/moa-r161-capture-record-stt-20261107 || true
      - name: Upload isolated R161 result and commit to feature
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f build/moa-r161-native/memo-recorder.dex.z.b64 build/moa-r161-native/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build(moa-r161): source-verified isolated DEX"
            git push origin HEAD:feature/moa-r161-capture-record-stt-20261107 || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MOA-R161-NEW-MEMO-DEX
          path: build/moa-r161-native
