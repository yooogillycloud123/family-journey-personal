name: MOA R757 inline diary AI compile
on:
  push:
    branches: [feature/moa-r757-diary-stability-auth-20261127]
    paths: ['.github/workflows/moa-r757-build.yml','experiments/moa-r757/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated inline controller
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/r757/{source,classes,dex,out}
          base64 -d experiments/moa-r757/native-source.b64 >/tmp/r757/source.zip
          echo '8faa7862cd7be1b0e6c197f1997f6b0e8d79c0c5f514040d1d2e492a63b660ac  /tmp/r757/source.zip' | sha256sum -c -
          unzip -q /tmp/r757/source.zip -d /tmp/r757/source
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          android="$sdk/platforms/android-35/android.jar"
          d8="$(find "$sdk/build-tools" -name d8 | sort -V | tail -1)"
          javac --release 8 -encoding UTF-8 -cp "$android" -d /tmp/r757/classes /tmp/r757/source/*.java
          find /tmp/r757/classes -name '*.class' -print0 | xargs -0 "$d8" --min-api 29 --lib "$android" --output /tmp/r757/dex
          cp /tmp/r757/dex/classes.dex /tmp/r757/out/classes27.dex
          sha256sum /tmp/r757/out/classes27.dex
          echo 'SDK35 javac + D8 compile PASS; physical account and media analysis NOT VERIFIED' > /tmp/r757/out/status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: moa-r757-native-dex-qa
          path: /tmp/r757/out/
