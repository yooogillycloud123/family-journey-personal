name: MOA R443 Gallery UI and Sharesheet Retention Native DEX
on:
  push:
    branches: [feature/moa-r391-session-persist-20261112, feature/moa-r407-real-launcher-class-fix-20261112, feature/moa-r411-window-masked-rearm-keepalive-20261112, feature/moa-r415-gallery-owner-freeze-view-20261112, feature/moa-r419-visual-stability-20261113, feature/moa-r423-splash-theme-opaque-20261113, feature/moa-r427-collapsible-transparent-webbar-20261113, feature/moa-r431-naver-webbar-safe-touch-home-20261113, feature/moa-r435-draggable-naver-home-20261113, feature/moa-r439-gallery-bottom-actions-20261113, feature/moa-r443-gallery-top-collapse-share-retain-20261113]
    paths:
      - 'experiments/moa-r391/**'
      - '.github/workflows/moa-r391-session-compile.yml'
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile additive DEX (no signing secrets)
        run: |
          set -euo pipefail
          mkdir -p /tmp/moa391/classes /tmp/moa391/dex build/moa-r391
          SRC=experiments/moa-r391/MoaR391SessionPersistProvider.java
          javac -encoding UTF-8 --release 8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d /tmp/moa391/classes "$SRC"
          find /tmp/moa391/classes -type f -name '*.class' -print0 | xargs -0 "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 29 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output /tmp/moa391/dex
          python3 - <<'PY'
          import pathlib,hashlib,base64,json
          d=pathlib.Path('/tmp/moa391/dex/classes.dex').read_bytes()
          assert d.startswith(b'dex\n')
          assert b'MoaR391SessionPersistProvider' in d and b'CookieManager' in d
          assert b'flush' in d and b'removeAllCookies' not in d and b'setCookie' not in d and b'getCookie' not in d
          p=pathlib.Path('build/moa-r391')
          (p/'classes17.dex.b64').write_text(base64.b64encode(d).decode()+'\n')
          (p/'report.json').write_text(json.dumps({'dex_size':len(d),'sha256':hashlib.sha256(d).hexdigest()},indent=2))
          print('MOA_R391_DEX_B64_START')
          print(base64.b64encode(d).decode())
          print('MOA_R391_DEX_B64_END')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: MOA-R391-SESSION-DEX
          path: build/moa-r391/
