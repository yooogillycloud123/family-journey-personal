name: MOA R767 verified Plus learning native beta publication
on:
  push:
    branches: [moa-update-channel]
    paths: ['.github/workflows/moa-publish-r767.yml']
permissions:
  contents: write
concurrency:
  group: moa-update-channel
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact signed APK and verify original signer and scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,struct,zlib,pathlib,json,zipfile
          p=pathlib.Path('android/releases')
          base=(p/'moa-r763.apk').read_bytes()
          assert hashlib.sha256(base).hexdigest()=='edb982eec7485a6051d98faefbdd0a00e40cb7b0967a097428fd90bba12cca41'
          d=zlib.decompress(base64.b64decode(''.join(pathlib.Path(f'android/staging/r767/delta{i}.b64').read_text() for i in range(10)),validate=True))
          assert len(d)==137930 and hashlib.sha256(d).hexdigest()=='75fda9a62d83e0a2acacca38aa297a7efa33aba7b77818830bfdf4dcec8465dd'
          i=0;out=bytearray()
          while i<len(d):
              op=d[i];i+=1
              if op==0:
                  s,n=struct.unpack_from('<II',d,i);i+=8
                  assert s+n<=len(base)
                  out.extend(base[s:s+n])
              elif op==1:
                  n=struct.unpack_from('<I',d,i)[0];i+=4
                  assert i+n<=len(d)
                  out.extend(d[i:i+n]);i+=n
              else:raise ValueError(op)
          assert len(out)==10914408 and hashlib.sha256(out).hexdigest()=='72d60d53bbf19eb9cf6fb714770c7937127d7dc21657447ae16ba90b1122283a'
          f=p/'moa-r767.apk';f.write_bytes(out)
          with zipfile.ZipFile(p/'moa-r763.apk') as old,zipfile.ZipFile(f) as new:
              assert new.testzip() is None
              assert hashlib.sha256(new.read('classes27.dex')).hexdigest()=='add9eeccc693914d969d1044be80e77a5f4d770e889b2a457cab622e34988984'
              assert hashlib.sha256(new.read('assets/web/moa-r755-inline-ai.js')).hexdigest()=='7c58dd18b60ccb819c2bb8d184fdaa345cd41fd97799a0019e92f4d9fd577d96'
              assert hashlib.sha256(new.read('assets/web/moa-r697-vertical-calendar.js')).hexdigest()=='9b0078eeb6543a08c3975df1f81ff19329268e45d26f10b717268e44f4a9d5b9'
              assert set(new.namelist())==set(old.namelist())
              assert {n for n in old.namelist() if old.read(n)!=new.read(n)}=={'AndroidManifest.xml','classes27.dex','assets/web/moa-r755-inline-ai.js','assets/web/moa-r697-vertical-calendar.js'}
              for n in new.namelist():
                  if n.endswith('.dex'):
                      b=new.read(n);assert b[:4]==b'dex\n' and hashlib.sha1(b[32:]).digest()==b[12:32] and zlib.adler32(b[12:])&0xffffffff==struct.unpack_from('<I',b,8)[0]
              assert b'<script src="moa-r751-studio.js"></script>' not in new.read('assets/web/index.html')
          assert json.loads(pathlib.Path('android/latest.json').read_text())['versionCode']==763
          PY
          test "$(git hash-object android/releases/moa-r767.apk)" = cb6114a2904d5383f7dfad76108d2003aac0ddcb
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT="$(find "$SDK/build-tools" -name apksigner | sort -V | tail -1 | xargs dirname)"
          "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 29 android/releases/moa-r767.apk | tee /tmp/moa-cert
          grep -F 'certificate SHA-256 digest: 5a86862beacac780a83729f3c01584d6d0ea5be88cf51827cb0b257d9caa0f15' /tmp/moa-cert
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/moa-cert
          "$BT/aapt2" dump badging android/releases/moa-r767.apk > /tmp/moa-badging
          grep -F "package: name='com.juhyeon.familyjournea' versionCode='767'" /tmp/moa-badging
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml android/releases/moa-r767.apk > /tmp/moa-manifest
          grep -F 'com.juhyeon.familyjournea.ai.MoaAiActivity' /tmp/moa-manifest
          grep -F 'android.intent.action.TTS_SERVICE' /tmp/moa-manifest
          "$BT/zipalign" -c 4 android/releases/moa-r767.apk
          python - <<'PY'
          import json,pathlib
          j={'packageName':'com.juhyeon.familyjournea','signerSha256':'5a86862beacac780a83729f3c01584d6d0ea5be88cf51827cb0b257d9caa0f15','versionCode':767,'bytes':10914408,'sha256':'72d60d53bbf19eb9cf6fb714770c7937127d7dc21657447ae16ba90b1122283a','apkUrl':'https://raw.githubusercontent.com/yooogillycloud123/family-journey-personal/moa-update-channel/android/releases/moa-r767.apk','published':True,'notes':'R767 베타: 읽기·독해와 생활 회화, 질문 탭 재생·일시정지·재개, 기기 내 말하기 인식, 누적 단어장, 미디어 미리보기, YouGlish 브라우저 탭, 7개 과목과 선택형 촬영 위치 확인. R759 골든 보존. 실기기 검증 대기.'}
          pathlib.Path('android/latest.json').write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Atomically activate exact verified APK and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r android/staging/r767
          git add android/latest.json android/releases/moa-r767.apk
          git commit -m 'Publish exact original-signed MOA R767 Plus learning native beta'
          git push origin HEAD:moa-update-channel
      - name: Verify actual public URLs and APK download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/verification
          python - <<'PY'
          import json,urllib.request,time,hashlib,subprocess,pathlib
          root='https://raw.githubusercontent.com/yooogillycloud123/family-journey-personal/'
          base=root+'moa-update-channel/android/latest.json'
          expected=json.loads(pathlib.Path('android/latest.json').read_text())
          out={}
          for attempt in range(13):
              out={}
              for label,url in [('exact',base),('nonce',base+'?moa_check='+str(time.time_ns())),('immutable',root+subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()+'/android/latest.json')]:
                  try:
                      with urllib.request.urlopen(url,timeout=15) as r:
                          j=json.load(r);out[label]={'status':r.status,'versionCode':j.get('versionCode'),'matches':j==expected,'headers':{k:v for k,v in r.headers.items() if k.lower() in ('age','cache-control','x-cache','date','etag','x-served-by')}}
                  except Exception as e:out[label]={'error':str(e)}
              if all(x.get('matches') for x in out.values()):break
              if attempt<12:time.sleep(25)
          with urllib.request.urlopen(expected['apkUrl'],timeout=30) as r:
              b=r.read(12000000);out['apk']={'status':r.status,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()}
          assert all(out[k].get('matches') for k in ('exact','nonce','immutable')),out
          assert out['apk']['bytes']==expected['bytes'] and out['apk']['sha256']==expected['sha256'],out
          pathlib.Path('android/verification/r767-public-endpoint.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          git add android/verification/r767-public-endpoint.json
          git commit -m 'Record R767 verified actual public update endpoint'
          git push origin HEAD:moa-update-channel
