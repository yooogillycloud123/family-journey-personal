name: FamilyJourneyIOS
options:
  bundleIdPrefix: com.juhyeon
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_CFBundleDisplayName: 우리 가족 여행
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 사진·동영상의 날짜와 GPS 정보를 기기에서 읽고 가족 일기와 지도를 만듭니다. 원본을 앱 서버로 전송하지 않습니다.
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 사용자가 명시적으로 만든 여행 영상을 사진 앱에 저장합니다.
    INFOPLIST_KEY_LSApplicationQueriesSchemes: nmap
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
targets:
  FamilyJourneyIOS:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juhyeon.familyjourney.ios
        PRODUCT_NAME: FamilyJourneyIOS
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 우리 가족 여행
        NSPhotoLibraryUsageDescription: 사진·동영상의 날짜와 GPS 정보를 기기에서 읽고 가족 일기와 지도를 만듭니다. 원본은 앱 서버로 전송하지 않습니다.
        NSPhotoLibraryAddUsageDescription: 사용자가 명시적으로 만든 여행 영상을 사진 앱에 저장합니다.
        LSApplicationQueriesSchemes: [nmap]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
schemes:
  FamilyJourneyIOS:
    build:
      targets:
        FamilyJourneyIOS: all
    run:
      config: Debug