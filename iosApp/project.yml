name: FamilyJourney
options:
  bundleIdPrefix: com.juhyeon
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.22
targets:
  FamilyJourney:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: 우리 가족여행
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        NSPhotoLibraryUsageDescription: 가족사진을 날짜별 달력에 정리하고 일기에 넣기 위해 접근합니다.
        NSPhotoLibraryAddUsageDescription: 사용자가 선택할 경우 사진 앱에 저장합니다.
        UIFileSharingEnabled: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juhyeon.familyjourney.ios
        GENERATE_INFOPLIST_FILE: 'NO'
        CODE_SIGNING_ALLOWED: 'NO'
    dependencies:
      - package: ZIPFoundation
